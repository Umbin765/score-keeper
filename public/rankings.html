<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rankings — Score Keeper</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 0 1rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .page-header h1 {
      font-size: 1.6rem;
      font-weight: 900;
    }

    .export-btn {
      background: var(--bg3);
      border: 1px solid var(--border);
      font-size: 0.9rem;
      padding: 0.45rem 1rem;
    }
    .export-btn:hover { background: var(--bg4); }

    /* Rankings table customisations */
    .data-table .team-num { font-weight: 700; font-family: var(--font-mono); }
    .data-table .rp-cell  { color: var(--yellow); font-weight: 700; }
    .data-table .hs-cell  { color: var(--green); }

    .rank-1 td:first-child { color: #ffd700; }
    .rank-2 td:first-child { color: #c0c0c0; }
    .rank-3 td:first-child { color: #cd7f32; }

    /* Expandable RP breakdown */
    .breakdown-row td {
      background: var(--bg3) !important;
      padding: 0;
    }
    .breakdown-row.hidden { display: none; }

    .breakdown-inner {
      padding: 0.75rem 1rem;
    }
    .breakdown-inner h4 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text2);
      margin-bottom: 0.5rem;
      font-weight: 700;
    }
    .breakdown-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    .breakdown-table th {
      background: var(--bg4);
      color: var(--text2);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.35rem 0.6rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .breakdown-table td {
      padding: 0.3rem 0.6rem;
      border-bottom: 1px solid var(--bg4);
    }
    .breakdown-table tr:last-child td { border-bottom: none; }
    .rp-earned { color: var(--green); font-weight: 700; }
    .rp-not    { color: var(--text2); }

    .expand-hint {
      font-size: 0.7rem;
      color: var(--text2);
      cursor: pointer;
      user-select: none;
    }
    tr.expandable-row { cursor: pointer; }
    tr.expandable-row:hover td { background: var(--bg3); }
    tr.expandable-row.open td { background: var(--bg3); }

    .no-data {
      text-align: center;
      color: var(--text2);
      padding: 2rem 0;
    }

    .last-updated {
      font-size: 0.75rem;
      color: var(--text2);
      text-align: right;
      margin-top: 0.5rem;
    }

    .table-wrap { overflow-x: auto; }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1>Rankings</h1>
      <div style="display:flex;gap:0.5rem;align-items:center;">
        <span id="expand-hint" class="expand-hint">Click a row for RP breakdown</span>
        <button class="export-btn" id="export-btn">Export CSV</button>
      </div>
    </div>

    <div class="table-wrap">
      <table class="data-table" id="rankings-table">
        <thead>
          <tr id="table-head"></tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <div id="no-data" class="no-data hidden">No rankings data yet.</div>
    <div id="last-updated" class="last-updated"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script>
    (function () {
      var tableHead    = document.getElementById('table-head');
      var tableBody    = document.getElementById('table-body');
      var noData       = document.getElementById('no-data');
      var lastUpdated  = document.getElementById('last-updated');
      var exportBtn    = document.getElementById('export-btn');

      // ── Column definitions ────────────────────────────────────────────────────
      var COLUMNS = [
        { label: 'Rank',           key: null,           cls: 'rank' },
        { label: 'Team #',         key: 'teamNumber',   cls: 'team-num' },
        { label: 'Name',           key: 'teamName',     cls: '' },
        { label: 'RP',             key: 'rp',           cls: 'rp-cell' },
        { label: 'Avg Score',      key: 'avgScore',     cls: '' },
        { label: 'W',              key: 'wins',         cls: '' },
        { label: 'L',              key: 'losses',       cls: '' },
        { label: 'T',              key: 'ties',         cls: '' },
        { label: 'High Score',     key: 'highScore',    cls: 'hs-cell' },
        { label: 'Played',         key: 'matchesPlayed',cls: '' },
      ];

      // ── Build header (once) ───────────────────────────────────────────────────
      COLUMNS.forEach(function (col) {
        var th = document.createElement('th');
        th.textContent = col.label;
        tableHead.appendChild(th);
      });
      // Extra column for expand arrow
      var thArrow = document.createElement('th');
      thArrow.textContent = '';
      tableHead.appendChild(thArrow);

      // ── Render ────────────────────────────────────────────────────────────────

      function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }

      var openTeam = null; // currently expanded team number

      function buildBreakdownRow(entry, colSpan) {
        var tr = document.createElement('tr');
        tr.className = 'breakdown-row hidden';

        var td = document.createElement('td');
        td.colSpan = colSpan;

        var inner = document.createElement('div');
        inner.className = 'breakdown-inner';

        var heading = document.createElement('h4');
        heading.textContent = 'RP Breakdown — ' + (entry.teamName || entry.teamNumber || 'Team');
        inner.appendChild(heading);

        var matches = entry.rpBreakdown || entry.matchHistory || [];
        if (matches.length === 0) {
          var msg = document.createElement('div');
          msg.style.color = 'var(--text2)';
          msg.style.fontSize = '0.85rem';
          msg.textContent = 'No per-match RP data available.';
          inner.appendChild(msg);
        } else {
          var bt = document.createElement('table');
          bt.className = 'breakdown-table';

          var btHead = document.createElement('thead');
          var btHr   = document.createElement('tr');
          ['Match', 'Park RP', 'Pattern RP', 'Ball RP', 'Total RP', 'Score'].forEach(function (h) {
            var bth = document.createElement('th');
            bth.textContent = h;
            btHr.appendChild(bth);
          });
          btHead.appendChild(btHr);
          bt.appendChild(btHead);

          var btBody = document.createElement('tbody');
          matches.forEach(function (m) {
            var btr = document.createElement('tr');
            function btd(val, earned) {
              var btdEl = document.createElement('td');
              btdEl.className = (earned !== undefined) ? (earned ? 'rp-earned' : 'rp-not') : '';
              btdEl.textContent = val != null ? val : '—';
              return btdEl;
            }
            btr.appendChild(btd('M' + (m.matchNumber || m.match || '?')));
            btr.appendChild(btd(m.parkRp ? 'Yes' : 'No', m.parkRp));
            btr.appendChild(btd(m.patternRp ? 'Yes' : 'No', m.patternRp));
            btr.appendChild(btd(m.ballRp ? 'Yes' : 'No', m.ballRp));
            btr.appendChild(btd(m.rp != null ? m.rp : '—'));
            btr.appendChild(btd(m.score != null ? m.score : '—'));
            btBody.appendChild(btr);
          });
          bt.appendChild(btBody);
          inner.appendChild(bt);
        }

        td.appendChild(inner);
        tr.appendChild(td);
        return tr;
      }

      function renderRankings(data) {
        clear(tableBody);
        noData.classList.add('hidden');

        if (!data || data.length === 0) {
          noData.classList.remove('hidden');
          return;
        }

        var colSpan = COLUMNS.length + 1;
        openTeam = null;

        data.forEach(function (entry, idx) {
          // Main data row
          var tr = document.createElement('tr');
          tr.className = 'expandable-row';
          if (idx === 0) tr.classList.add('rank-1');
          if (idx === 1) tr.classList.add('rank-2');
          if (idx === 2) tr.classList.add('rank-3');

          COLUMNS.forEach(function (col) {
            var td = document.createElement('td');
            if (col.cls) td.className = col.cls;
            if (col.key === null) {
              td.textContent = idx + 1;
            } else if (col.key === 'avgScore') {
              var v = entry[col.key];
              td.textContent = v != null ? Number(v).toFixed(1) : '—';
            } else if (col.key === 'teamNumber') {
              td.textContent = entry.teamNumber || entry.team || '—';
            } else if (col.key === 'teamName') {
              td.textContent = entry.teamName || entry.name || '—';
            } else {
              var val = entry[col.key];
              td.textContent = val != null ? val : '—';
            }
            tr.appendChild(td);
          });

          // Arrow cell
          var arrowTd = document.createElement('td');
          var arrow = document.createElement('span');
          arrow.style.cssText = 'font-size:0.75rem;color:var(--text2);';
          arrow.textContent = '▶';
          arrowTd.appendChild(arrow);
          tr.appendChild(arrowTd);

          // Breakdown row
          var breakdownTr = buildBreakdownRow(entry, colSpan);

          tr.addEventListener('click', function () {
            var isOpen = !breakdownTr.classList.contains('hidden');
            // Close any open row
            var allBreakdowns = tableBody.querySelectorAll('.breakdown-row');
            var allArrows     = tableBody.querySelectorAll('.expandable-row span');
            var allExpandable = tableBody.querySelectorAll('.expandable-row');
            for (var i = 0; i < allBreakdowns.length; i++) {
              allBreakdowns[i].classList.add('hidden');
            }
            for (var i = 0; i < allArrows.length; i++) {
              allArrows[i].textContent = '▶';
            }
            for (var i = 0; i < allExpandable.length; i++) {
              allExpandable[i].classList.remove('open');
            }

            if (!isOpen) {
              breakdownTr.classList.remove('hidden');
              arrow.textContent = '▼';
              tr.classList.add('open');
            }
          });

          tableBody.appendChild(tr);
          tableBody.appendChild(breakdownTr);
        });

        var now = new Date();
        lastUpdated.textContent = 'Last updated: ' + now.toLocaleTimeString();
      }

      // ── Export ────────────────────────────────────────────────────────────────
      exportBtn.addEventListener('click', function () {
        window.location.href = '/api/export/rankings.csv';
      });

      // ── Fetch ─────────────────────────────────────────────────────────────────
      function fetchRankings() {
        fetch('/api/rankings').then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        }).then(function (data) {
          renderRankings(data);
        }).catch(function (e) {
          console.error('Rankings fetch error:', e);
          noData.classList.remove('hidden');
          noData.textContent = 'Failed to load rankings.';
        });
      }

      // ── Socket ────────────────────────────────────────────────────────────────
      var socket = SK.connectSocket();
      if (socket) {
        socket.on('rankings_update', function (data) {
          if (data && Array.isArray(data)) {
            renderRankings(data);
          } else {
            fetchRankings();
          }
        });
      }

      // ── Init ──────────────────────────────────────────────────────────────────
      fetchRankings();
    })();
  </script>
</body>
</html>
