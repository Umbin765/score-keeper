<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display — Score Keeper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    @font-face { font-family: 'Barlow Condensed'; font-weight: 700; font-style: normal;
      src: url('/fonts/BarlowCondensed-700.woff2') format('woff2'); font-display: swap; }
    @font-face { font-family: 'Barlow Condensed'; font-weight: 800; font-style: normal;
      src: url('/fonts/BarlowCondensed-800.woff2') format('woff2'); font-display: swap; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; height: 100vh;
      background: transparent;
      overflow: hidden;
      font-family: 'Roboto', Tahoma, Arial, sans-serif;
    }

    /*
     * The overlay is designed on a fixed 1920×1080 canvas (all values in px,
     * taken from the reference broadcast display) and scaled to the viewport
     * width by JS. At 1920px wide the scale is exactly 1.
     */
    #overlay {
      position: fixed; bottom: 0; left: 0;
      width: 1920px; height: 255px;
      transform-origin: 0 100%;
    }

    /* ── MOTIF REVEAL SCREEN ── */
    #motif-reveal {
      position: fixed; top: 0; left: 0; right: 0;
      bottom: calc(100vw * 255 / 1920);
      display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.90);
      z-index: 50;
      opacity: 0; pointer-events: none;
      transition: opacity 0.45s ease;
    }
    #motif-reveal.visible { opacity: 1; pointer-events: auto; }
    .motif-card {
      background: #fff; border-radius: 14px;
      padding: clamp(1.4rem, 3.5vh, 2.6rem) clamp(2rem, 5vw, 4rem);
      text-align: center;
      box-shadow: 0 12px 60px rgba(0,0,0,0.6);
      display: flex; flex-direction: column; align-items: center; gap: clamp(0.8rem, 2vh, 1.4rem);
    }
    #reveal-balls {
      display: flex; gap: clamp(1rem, 3vw, 2.5rem); align-items: center; justify-content: center;
    }
    .reveal-ball {
      width: clamp(70px, 12vw, 140px); height: clamp(70px, 12vw, 140px); flex-shrink: 0;
    }
    #reveal-label {
      font-size: clamp(1rem, 3.2vw, 2.4rem); font-weight: 700;
      color: #111; text-transform: uppercase; letter-spacing: 0.1em; line-height: 1;
    }

    /* ── POST-MATCH BANNER ── */
    #post-banner {
      position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
      background: rgba(0,18,0,0.95); border: 2px solid #00cc44;
      border-radius: 10px 10px 0 0; padding: 10px 48px 12px;
      text-align: center; display: none; white-space: nowrap;
    }
    #post-banner.visible { display: block; }
    .post-title { font-size: 38px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: #00cc44; line-height: 1; }
    .post-sub   { font-size: 14px; color: rgba(255,255,255,0.5); font-weight: 500; text-transform: uppercase; letter-spacing: 0.10em; margin-top: 4px; }
    #post-banner.post-banner--review { border-color: #555; background: rgba(20,20,20,0.95); }
    #post-banner.post-banner--review .post-title { color: #bbb; }

    /* ── TITLE BAR ── */
    #title-bar {
      height: 75px; background: #000;
      display: flex; align-items: stretch;
    }
    .tb-logo {
      width: 250px; flex-shrink: 0; background: #fff;
      display: flex; align-items: center; justify-content: center;
    }
    .tb-logo img { height: 45px; width: auto; max-width: 230px; }
    .tb-text {
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 36px;
      overflow: hidden; white-space: nowrap;
    }
    #event-name { flex: 55 1 0; }
    #match-info { flex: 45 1 0; }
    .tb-divider { width: 3px; flex-shrink: 0; background: #fff; }

    /* ── SCORE BAR ── */
    #score-bar { height: 180px; position: relative; }

    /* Half backgrounds: dark base + bright accent polygon
       (22px strip along the top + 225px block beside the timer) */
    .bg-half { position: absolute; top: 0; height: 180px; width: 960px; overflow: hidden; }
    .bg-red  { left: 0;     background: #830E12; }
    .bg-blue { left: 960px; background: #004172; }
    .bg-red  svg { position: absolute; left: 0;  top: 0; }
    .bg-blue svg { position: absolute; right: 0; top: 0; }

    /* ── SCORE PILLS ── */
    .pill-col {
      position: absolute; top: 43px; width: 175px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .pill-col.red-side  { left: 29.8px; }
    .pill-col.blue-side { left: 1715.2px; }

    .score-pill {
      background: #fff; height: 50px;
      display: flex; overflow: hidden;
    }
    .pill-label {
      width: 50px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .red-accent  { background: #ED1C24; }
    .blue-accent { background: #0066B3; }

    .robot-svg { width: 40px; height: 40px; fill: #fff; }

    .pill-value {
      flex: 1; display: flex; align-items: center; justify-content: center;
      font-size: 42px; font-weight: 700; color: #000;
    }
    .card-x {
      width: 52.5px; height: 42px;
      display: flex; align-items: center; justify-content: center;
      font-size: 42px; font-weight: 700; color: #000; line-height: 1;
    }
    .card-x svg { width: 26.25px; height: 42px; fill: #000; }
    .card-x.yc { color: #c8a000; }
    .card-x.rc { color: #cc0000; }

    .mini-motif { display: flex; gap: 2px; align-items: center; justify-content: center; }
    .mini-motif img { width: 14px; height: 14px; }

    /* ── SUB-SCORE PILL (auto / teleop with shared goal cell) ── */
    .sub-pill {
      position: absolute; top: 51px;
      width: 210.7px; height: 100px;
      background: #fff; display: flex; overflow: hidden;
      transition: background 0.3s ease;
    }
    .sub-pill.rp-silver { background: #c0c0c0; }
    .sub-pill.rp-gold   { background: #FFD700; }
    .sub-pill.red-side  { left: 234.5px; }
    .sub-pill.blue-side { left: 1474.8px; }

    .sub-label {
      width: 50px; flex-shrink: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .sub-icon {
      width: 40px; height: 50px;
      display: flex; align-items: center; justify-content: center;
    }
    .arrow-svg { width: 40px; height: 35px; fill: #fff; }
    .sub-icon img { width: 40px; height: 39px; }

    .sub-values { width: 80px; flex-shrink: 0; display: flex; flex-direction: column; }
    .sub-row {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 0 10px;
      font-size: 42px; font-weight: 700; color: #000;
      font-variant-numeric: tabular-nums; line-height: 1;
    }
    .sub-row:first-child { border-bottom: 2px solid #000; }

    .goal {
      width: 80.7px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 34px; font-weight: 700; line-height: 1;
    }

    /* ── TEAM NUMBERS ── */
    .team-col {
      position: absolute; top: 22px; width: 150px;
      display: flex; flex-direction: column; gap: 2px;
    }
    .team-col.red-side  { left: 485px; }
    .team-col.blue-side { left: 1285px; }
    .team-num {
      height: 78px; background: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; font-weight: 700; color: #000;
      font-variant-numeric: tabular-nums; line-height: 46px;
    }
    .team-num.carded-yellow { background: #ffd400; }
    .team-num.carded-red    { background: #cc0000; color: #fff; }

    /* ── ALLIANCE LABEL + TOTAL ── */
    .alliance-block { position: absolute; top: 0; width: 225px; height: 180px; }
    .alliance-block.red-side  { left: 635px; }
    .alliance-block.blue-side { left: 1060px; }
    .a-label {
      margin-top: 36px; height: 30px;
      font-size: 30px; font-weight: 700; color: #EDEDED;
      text-align: center; line-height: 30px;
    }
    .a-score {
      margin-top: 4px; height: 112px;
      display: flex; align-items: center; justify-content: center;
      font-size: 90px; font-weight: 700; color: #EDEDED;
      font-variant-numeric: tabular-nums; line-height: 1;
    }
    .alliance-block.winner .a-score { text-shadow: 0 0 20px rgba(255,255,255,0.4); }

    /* ── TIMER PANEL ── */
    #timer-panel {
      position: absolute; left: 857.5px; top: 0;
      width: 205px; height: 180px;
      background: #fff; text-align: center;
    }
    #period-label {
      position: absolute; top: 14px; left: 0; right: 0;
      font-size: 15px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.1em; color: #aaa; line-height: 1;
    }
    #timer-display {
      display: block; padding-top: 50px;
      font-size: 90px; line-height: 90px; font-weight: 700;
      color: #000; font-variant-numeric: tabular-nums;
    }
    #timer-display.endgame { color: #b86a00; }

    /* ── MOTIF ARTIFACTS (under timer) ── */
    #motif-dots {
      position: absolute; top: 140px; left: 0; right: 0; height: 35px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .motif-d { width: 35.6px; height: 35px; flex-shrink: 0; }
    .motif-d-empty {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      background: rgba(0,0,0,0.12); border: 1px solid rgba(0,0,0,0.18);
    }

    /* ── RP GOAL CELL STATES ── */
    .goal.rp2 {
      transition: background 0.3s;
    }
    /* ── MATCH RESULTS SCREEN ── */
    #results-screen {
      position: fixed; inset: 0; z-index: 80;
      display: none; flex-direction: column;
      background: #101318;
      font-family: 'Barlow Condensed', sans-serif;
      opacity: 0; transition: opacity 0.4s ease;
    }
    #results-screen.visible { display: flex; opacity: 1; }
    .rs-header {
      display: flex; align-items: center; justify-content: space-between;
      background: #000; color: #fff; padding: 1.2vh 2.5vw;
      font-weight: 800; font-size: clamp(22px, 3.2vh, 42px); text-transform: uppercase;
    }
    .rs-body {
      flex: 1; display: grid;
      grid-template-columns: 1fr 1.4fr 1fr;
      grid-template-rows: auto 1fr auto;
      gap: 1.5vh 1.5vw; padding: 2.5vh 3vw;
      max-width: 1700px; width: 100%; margin: 0 auto;
    }
    .rs-winner {
      background: #FFD400; color: #111; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; gap: 0.8vw;
      font-weight: 800; font-size: clamp(28px, 5vh, 64px); text-transform: uppercase;
      visibility: hidden;
    }
    .rs-winner.tie { background: #999; }
    .rs-winner svg { width: clamp(28px, 4.5vh, 56px); height: clamp(28px, 4.5vh, 56px); fill: #111; }
    .rs-scores { display: flex; gap: 4px; }
    .rs-score-panel { flex: 1; border-radius: 8px; color: #fff; text-align: center; padding: 1vh 0; }
    .rs-score-panel.blue { background: #0066B3; }
    .rs-score-panel.red  { background: #ED1C24; }
    .rs-score-label { font-weight: 700; font-size: clamp(18px, 2.6vh, 34px); opacity: 0.92; }
    .rs-score-total { font-weight: 800; font-size: clamp(44px, 8vh, 104px); line-height: 1; font-variant-numeric: tabular-nums; }
    .rs-rows { display: flex; flex-direction: column; justify-content: center; gap: 0.6vh; }
    .rs-row {
      display: grid; grid-template-columns: 1fr 2fr 1fr; align-items: center;
      background: #1b202a; border-radius: 6px; padding: 0.8vh 1.2vw;
      font-size: clamp(20px, 3.4vh, 44px); font-weight: 700; color: #fff;
    }
    .rs-row:nth-child(even) { background: #171b23; }
    .rs-row .v { text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }
    .rs-row .l { text-align: center; color: #8b93a8; letter-spacing: 0.08em; text-transform: uppercase; }
    .rs-teams { display: flex; flex-direction: column; gap: 1.2vh; justify-content: flex-start; padding-top: 1vh; }
    .rs-team {
      display: flex; align-items: stretch; border-radius: 6px; overflow: hidden;
      font-size: clamp(20px, 3.2vh, 42px); font-weight: 800; color: #fff;
    }
    .rs-team .num { flex: 1; padding: 1vh 1vw; display: flex; align-items: center; }
    .rs-teams.blue .num { background: #0066B3; }
    .rs-teams.red  .num { background: #ED1C24; }
    .rs-team .rank {
      width: 5.5ch; background: #fff; color: #111;
      display: flex; align-items: center; justify-content: center; gap: 0.2ch;
      font-variant-numeric: tabular-nums;
    }
    .rs-team .rank .arr.up { color: #16c95c; } .rs-team .rank .arr.down { color: #e5233d; }
    .rs-rp { display: flex; flex-direction: column; gap: 0.8vh; justify-content: flex-end; }
    .rs-rp-title { color: #fff; font-weight: 700; font-size: clamp(16px, 2.4vh, 30px); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.2vh; }
    .rs-rp-list { display: flex; flex-direction: column; gap: 0.4vh; }
    .rs-rp-row {
      display: flex; align-items: center; justify-content: space-between; gap: 1.5vw;
      background: #1b202a; border-radius: 5px; padding: 0.5vh 0.8vw;
      font-size: clamp(16px, 2.6vh, 34px); font-weight: 700; color: #fff; opacity: 0.35;
      transition: opacity 0.3s;
    }
    .rs-rp-row.lit { opacity: 1; }
    .rs-rp-row .rp-name { text-transform: uppercase; letter-spacing: 0.06em; color: #8b93a8; font-size: 0.78em; }
    .rs-rp-row.lit .rp-name { color: #c8d0e0; }
    .rs-rp-row .rp-pts { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .rs-qr { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 0.8vh; }
    .rs-qr .qr-box { background: #fff; padding: 8px; border-radius: 6px; line-height: 0; }
    .rs-qr .qr-box img { width: clamp(70px, 12vh, 140px); height: clamp(70px, 12vh, 140px); image-rendering: pixelated; }
    .rs-qr .qr-cap { color: #8b93a8; font-weight: 700; font-size: clamp(13px, 1.8vh, 22px); text-transform: uppercase; letter-spacing: 0.06em; }
    #rs-symbol-defs { position: absolute; width: 0; height: 0; overflow: hidden; }

    /* ── WINNER ANIMATION ── */
    #winner-anim {
      position: fixed; inset: 0; z-index: 90;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 70%, #2a2015 0%, #14100a 55%, #0a0806 100%);
      opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
    }
    #winner-anim.visible { opacity: 1; pointer-events: auto; }
    #pyr { width: min(56vw, 62vh); height: auto; }
    #pyr .tier { fill: none; stroke: var(--win-color, #888); stroke-width: 3;
      filter: drop-shadow(0 0 10px var(--win-color, #888)); }
    #pyr-solid .tier { fill: var(--win-color, #888); fill-opacity: 0.85; stroke: none; filter: none; }
    #pyr-fill-rect { y: 560px; transition: y 2s cubic-bezier(0.25, 0.6, 0.3, 1); }
    #winner-anim.filling #pyr-fill-rect { y: 0px; }
    #win-banner {
      position: absolute; left: 50%; top: 62%;
      transform: translate(-50%, -50%) rotate(-4deg) scale(3);
      background: var(--win-color, #888);
      border: 6px solid rgba(0,0,0,0.35); border-radius: 12px;
      padding: 1.2vh 5vw; opacity: 0;
      box-shadow: 0 18px 60px rgba(0,0,0,0.6);
    }
    #winner-anim.banner-in #win-banner { animation: bannerSlam 0.45s cubic-bezier(0.2, 1.4, 0.4, 1) forwards; }
    @keyframes bannerSlam {
      from { opacity: 0; transform: translate(-50%, -50%) rotate(-4deg) scale(3); }
      to   { opacity: 1; transform: translate(-50%, -50%) rotate(-4deg) scale(1); }
    }
    #win-banner-text {
      font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
      font-size: clamp(48px, 9vw, 130px); line-height: 1.1;
      color: #fff; text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap;
      text-shadow: 0 4px 0 rgba(0,0,0,0.35), 0 0 2px rgba(0,0,0,0.5);
      -webkit-text-stroke: 2px rgba(0,0,0,0.25);
    }
  </style>
</head>
<body>
<div id="motif-reveal">
  <div class="motif-card">
    <div id="reveal-balls"></div>
    <div id="reveal-label">MOTIF</div>
  </div>
</div>
<svg id="rs-symbol-defs" aria-hidden="true">
  <symbol id="rp-trophy" viewBox="0 0 576 512"><path d="M400 0H176c-26.5 0-48.1 21.8-47.1 48.2c.2 5.3 .4 10.6 .7 15.8H24C10.7 64 0 74.7 0 88c0 92.6 33.5 157 78.5 200.7c44.3 43.1 98.3 64.8 138.1 75.8c23.4 6.5 39.4 26 39.4 45.6c0 20.9-17 37.9-37.9 37.9H192c-17.7 0-32 14.3-32 32s14.3 32 32 32H384c17.7 0 32-14.3 32-32s-14.3-32-32-32H357.9C337 448 320 431 320 410.1c0-19.6 15.9-39.2 39.4-45.6c39.9-11 93.9-32.7 138.2-75.8C542.5 245 576 180.6 576 88c0-13.3-10.7-24-24-24H446.4c.3-5.2 .5-10.4 .7-15.8C448.1 21.8 426.5 0 400 0z"/></symbol>
  <symbol id="rp-base" viewBox="0 0 576 512"><path d="M575.8 255.5c0 18-15 32.1-32 32.1h-32l.7 160.2c0 2.7-.2 5.4-.5 8.1V472c0 22.1-17.9 40-40 40H456c-1.1 0-2.2 0-3.3-.1c-1.4 .1-2.8 .1-4.2 .1H416 392c-22.1 0-40-17.9-40-40V448 384c0-17.7-14.3-32-32-32H256c-17.7 0-32 14.3-32 32v64 24c0 22.1-17.9 40-40 40H160 128.1c-1.5 0-3-.1-4.5-.2c-1.2 .1-2.4 .2-3.6 .2H104c-22.1 0-40-17.9-40-40V360c0-.9 0-1.9 .1-2.8V287.6H32c-18 0-32-14-32-32.1c0-9 3-17 10-24L266.4 8c7-7 15-8 22-8s15 2 21 7L564.8 231.5c8 7 12 15 11 24z"/></symbol>
  <symbol id="rp-pattern" viewBox="0 0 448 512"><path d="M128 32H32C14.3 32 0 46.3 0 64v96c0 17.7 14.3 32 32 32h96c17.7 0 32-14.3 32-32V64c0-17.7-14.3-32-32-32zm0 160H32c-17.7 0-32 14.3-32 32v96c0 17.7 14.3 32 32 32h96c17.7 0 32-14.3 32-32V224c0-17.7-14.3-32-32-32zM416 32h-96c-17.7 0-32 14.3-32 32v96c0 17.7 14.3 32 32 32h96c17.7 0 32-14.3 32-32V64c0-17.7-14.3-32-32-32zm0 320h-96c-17.7 0-32 14.3-32 32v96c0 17.7 14.3 32 32 32h96c17.7 0 32-14.3 32-32V384c0-17.7-14.3-32-32-32z"/></symbol>
  <symbol id="rp-ball" viewBox="0 0 512 512"><path d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512z"/></symbol>
</svg>

<div id="results-screen">
  <div class="rs-header">
    <div>Match Results</div>
    <div id="rs-match-label">&#x2014;</div>
    <div id="rs-event-label">&#x2014;</div>
  </div>
  <div class="rs-body">
    <div class="rs-winner" id="rs-winner-blue"><svg><use href="#rp-trophy"/></svg><span class="rs-winner-txt">WINNER</span></div>
    <div class="rs-scores">
      <div class="rs-score-panel blue"><div class="rs-score-label">Blue</div><div class="rs-score-total" id="rs-blue-total">0</div></div>
      <div class="rs-score-panel red"><div class="rs-score-label">Red</div><div class="rs-score-total" id="rs-red-total">0</div></div>
    </div>
    <div class="rs-winner" id="rs-winner-red"><svg><use href="#rp-trophy"/></svg><span class="rs-winner-txt">WINNER</span></div>
    <div class="rs-teams blue" id="rs-teams-blue"></div>
    <div class="rs-rows" id="rs-rows"></div>
    <div class="rs-teams red" id="rs-teams-red"></div>
    <div class="rs-rp"><div class="rs-rp-title">Ranking Points</div><div class="rs-rp-list" id="rs-rp-blue"></div></div>
    <div class="rs-qr"><div class="qr-box" id="rs-qr"></div><div class="qr-cap">Scan for live results</div></div>
    <div class="rs-rp"><div class="rs-rp-title">Ranking Points</div><div class="rs-rp-list" id="rs-rp-red"></div></div>
  </div>
</div>

<div id="winner-anim">
  <svg id="pyr" viewBox="0 0 800 560" aria-hidden="true">
    <defs>
      <clipPath id="pyr-fill-clip"><rect id="pyr-fill-rect" x="0" y="560" width="800" height="560"/></clipPath>
    </defs>
    <g id="pyr-solid" clip-path="url(#pyr-fill-clip)">
      <rect class="tier" x="60"  y="460" width="680" height="100"/>
      <rect class="tier" x="140" y="360" width="520" height="100"/>
      <rect class="tier" x="220" y="260" width="360" height="100"/>
      <rect class="tier" x="300" y="160" width="200" height="100"/>
      <rect class="tier" x="352" y="60"  width="96"  height="100"/>
    </g>
    <g id="pyr-outline">
      <rect class="tier" x="60"  y="460" width="680" height="100"/>
      <rect class="tier" x="140" y="360" width="520" height="100"/>

<script src="/socket.io/socket.io.js"></script>

<script src="/js/common.js"></script>
<script>
(function () {
  'use strict';

  var timerEl     = document.getElementById('timer-display');
  var periodEl    = document.getElementById('period-label');
  var blueScore   = document.getElementById('blue-score');
  var redScore    = document.getElementById('red-score');
  var blueAuto    = document.getElementById('blue-auto');
  var blueTeleop  = document.getElementById('blue-teleop');
  var redAuto     = document.getElementById('red-auto');
  var redTeleop   = document.getElementById('red-teleop');
  var redSubPill  = document.getElementById('red-sub-pill');
  var blueSubPill = document.getElementById('blue-sub-pill');
  var blueFoul    = document.getElementById('blue-foul');
  var redFoul     = document.getElementById('red-foul');
  var blueYcard   = document.getElementById('blue-ycard');
  var blueRcard   = document.getElementById('blue-rcard');
  var redYcard    = document.getElementById('red-ycard');
  var redRcard    = document.getElementById('red-rcard');
  var bluePanel   = document.getElementById('blue-panel');
  var redPanel    = document.getElementById('red-panel');
  var postBanner  = document.getElementById('post-banner');
  var postSub     = document.getElementById('post-sub');
  var eventNameEl = document.getElementById('event-name');
  var matchInfoEl = document.getElementById('match-info');
  var motifDotsEl = document.getElementById('motif-dots');
  var redT1       = document.getElementById('red-t1');
  var redT2       = document.getElementById('red-t2');
  var blueT1      = document.getElementById('blue-t1');
  var blueT2      = document.getElementById('blue-t2');
  var overlayEl   = document.getElementById('overlay');

  var matchActive  = false;
  var reviewing    = false;
  var totalMatches = 0;

  // RP goal cell elements
  var redGoal  = document.getElementById('red-goal');
  var blueGoal = document.getElementById('blue-goal');

  // Ball RP thresholds (loaded from settings — no hardcoded fallbacks)
  var ballRpT1 = null;
  var ballRpT2 = null;

  var motifRevealEl  = document.getElementById('motif-reveal');
  var revealBallsEl  = document.getElementById('reveal-balls');
  var revealLabelEl  = document.getElementById('reveal-label');
  var revealTimer    = null;

  // ── Overlay scaling (1920×1080 design canvas → viewport) ──────────────────
  function fitOverlay() {
    overlayEl.style.transform = 'scale(' + (window.innerWidth / 1920) + ')';
  }
  window.addEventListener('resize', fitOverlay);
  fitOverlay();

  // ── Artifact ball images ───────────────────────────────────────────────────
  var ARTIFACT_SRC = {
    G: '/img/artifact-green.svg',
    P: '/img/artifact-purple.svg',
    W: '/img/artifact-white.svg'
  };

  function artifactImg(ch, cssClass) {
    var img = document.createElement('img');
    img.src = ARTIFACT_SRC[ch] || ARTIFACT_SRC.W;
    img.alt = '';
    if (cssClass) img.className = cssClass;
    return img;
  }

  // FontAwesome 6 xmark, shown when an alliance has no card of that color
  var SVG_NS = 'http://www.w3.org/2000/svg';

  // ── Match Results screen ────────────────────────────────────────────────────
  var resultsEl     = document.getElementById('results-screen');
  var rsMatchLabel  = document.getElementById('rs-match-label');
  var rsEventLabel  = document.getElementById('rs-event-label');
  var rsBlueTotal   = document.getElementById('rs-blue-total');
  var rsRedTotal    = document.getElementById('rs-red-total');
  var rsWinnerBlue  = document.getElementById('rs-winner-blue');
  var rsWinnerRed   = document.getElementById('rs-winner-red');
  var rsRows        = document.getElementById('rs-rows');
  var rsTeamsBlue   = document.getElementById('rs-teams-blue');
  var rsTeamsRed    = document.getElementById('rs-teams-red');
  var rsRpBlue      = document.getElementById('rs-rp-blue');
  var rsRpRed       = document.getElementById('rs-rp-red');
  var currentResults = null;
  var qrRendered = false;

  var RS_CATS = [
    ['leave', 'Leave'], ['artifact', 'Artifact'], ['pattern', 'Pattern'],
    ['base', 'Base'], ['foul', 'Foul']
  ];

  function clearEl(el) { while (el.firstChild) el.removeChild(el.firstChild); }

  function makeUseIcon(symbolId) {
    var svg = document.createElementNS(SVG_NS, 'svg');
    var use = document.createElementNS(SVG_NS, 'use');
    use.setAttribute('href', '#' + symbolId);
    svg.appendChild(use);
    return svg;
  }

  function rpIconRow(container, rp) {
    clearEl(container);
    var groups = [
      ['Win / Loss', rp ? rp.winLossRp || 0 : 0],
      ['Park',       rp ? rp.parkRp    || 0 : 0],
      ['Pattern',    rp ? rp.patternRp || 0 : 0]
    ];
    groups.forEach(function (g) {
      var row = document.createElement('div');
      row.className = 'rs-rp-row' + (g[1] > 0 ? ' lit' : '');
      var name = document.createElement('span');
      name.className = 'rp-name';
      name.textContent = g[0];
      var pts = document.createElement('span');
      pts.className = 'rp-pts';
      pts.textContent = g[1] + ' pt' + (g[1] === 1 ? '' : 's');
      row.appendChild(name);
      row.appendChild(pts);
      container.appendChild(row);
    });
  }

  function renderTeamPills(container, teams) {
    clearEl(container);
    (teams || []).forEach(function (t) {
      var pill = document.createElement('div');
      pill.className = 'rs-team';
      var num = document.createElement('div');
      num.className = 'num';
      num.textContent = t.number;
      var rank = document.createElement('div');
      rank.className = 'rank';
      var r = document.createElement('span');
      r.textContent = t.rank != null ? t.rank : '\u2014';
      var arr = document.createElement('span');
      arr.className = 'arr ' + (t.delta == null || t.delta === 0 ? '' : t.delta < 0 ? 'down' : 'up');
      arr.textContent = t.delta == null || t.delta === 0 ? '\u2014' : t.delta > 0 ? '\u2191' : '\u2193';
      rank.appendChild(r);
      rank.appendChild(arr);
      pill.appendChild(num);
      pill.appendChild(rank);
      container.appendChild(pill);
    });
  }

  function renderResultsData(r) {
    rsMatchLabel.textContent = (r.match && r.match.phase === 'playoffs' ? 'Playoff ' : 'Qualification ') +
      (r.match ? r.match.match_number : '') + (r.matchCount ? ' of ' + r.matchCount : '');
    rsEventLabel.textContent = eventNameEl.textContent !== '\u2014' ? eventNameEl.textContent : 'DECODE';
    rsBlueTotal.textContent = r.blue.total;
    rsRedTotal.textContent  = r.red.total;
    rsWinnerBlue.style.visibility = r.winner === 'blue' || r.winner === 'tie' ? 'visible' : 'hidden';
    rsWinnerRed.style.visibility  = r.winner === 'red'  || r.winner === 'tie' ? 'visible' : 'hidden';
    rsWinnerBlue.classList.toggle('tie', r.winner === 'tie');
    rsWinnerRed.classList.toggle('tie', r.winner === 'tie');
    rsWinnerBlue.querySelector('.rs-winner-txt').textContent = r.winner === 'tie' ? 'TIE' : 'WINNER';
    rsWinnerRed.querySelector('.rs-winner-txt').textContent  = r.winner === 'tie' ? 'TIE' : 'WINNER';

    clearEl(rsRows);
    RS_CATS.forEach(function (c) {
      var row = document.createElement('div');
      row.className = 'rs-row';
      var vb = document.createElement('div');
      vb.className = 'v';
      vb.textContent = r.blue.breakdown[c[0]] || 0;
      var l = document.createElement('div');
      l.className = 'l';
      l.textContent = c[1];
      var vr = document.createElement('div');
      vr.className = 'v';
      vr.textContent = r.red.breakdown[c[0]] || 0;
      row.appendChild(vb); row.appendChild(l); row.appendChild(vr);
      rsRows.appendChild(row);
    });

    renderTeamPills(rsTeamsBlue, r.teams && r.teams.blue);
    renderTeamPills(rsTeamsRed,  r.teams && r.teams.red);
    rpIconRow(rsRpBlue, r.blue.rp);
    rpIconRow(rsRpRed,  r.red.rp);

    if (!qrRendered && typeof qrcode === 'function') {
      var qr = qrcode(0, 'M');
      qr.addData(location.origin + '/public');
      qr.make();
      var img = document.createElement('img');
      img.src = qr.createDataURL(4, 0);   // GIF data URL — no HTML injection
      img.alt = 'QR: live results';
      var box = document.getElementById('rs-qr');
      clearEl(box);
      box.appendChild(img);
      qrRendered = true;
    }
  }

  function showResultsScreen(results) {
    currentResults = results;
    renderResultsData(results);
    resultsEl.classList.add('visible');
  }

  function hideResultsScreen() {
    currentResults = null;
    resultsEl.classList.remove('visible');
  }

  // Rebuild category points from a broadcastScores payload (live update after reveal)
  function catFromPts(p) {
    p = p || {};
    return {
      leave:    p.auto_leave || 0,
      artifact: (p.auto_classified || 0) + (p.auto_overflow || 0) + (p.teleop_classified || 0) + (p.teleop_overflow || 0),
      pattern:  (p.auto_pattern || 0) + (p.teleop_pattern || 0),
      base:     p.park || 0,
      foul:     p.penalties || 0
    };
  }

  function updateResultsFromScoreUpdate(data) {
    if (!currentResults || !data || data.matchId !== currentResults.matchId) return;
    currentResults.red  = { total: data.red.total,  breakdown: catFromPts(data.red.ptsBreakdown),  rp: data.redRP };
    currentResults.blue = { total: data.blue.total, breakdown: catFromPts(data.blue.ptsBreakdown), rp: data.blueRP };
    currentResults.winner = data.red.total > data.blue.total ? 'red' : data.blue.total > data.red.total ? 'blue' : 'tie';
    renderResultsData(currentResults);
  }

  function updateResultsRanks(rankings) {
    if (!currentResults || !rankings) return;
    ['red', 'blue'].forEach(function (a) {
      (currentResults.teams[a] || []).forEach(function (t) {
        var row = rankings.find(function (x) { return x.teamNumber === t.number; });
        if (row) t.rank = row.rank;
      });
    });
    renderTeamPills(rsTeamsBlue, currentResults.teams.blue);
    renderTeamPills(rsTeamsRed,  currentResults.teams.red);
  }
  function makeXmark() {
    var svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', '0 0 320 512');
    var path = document.createElementNS(SVG_NS, 'path');
    path.setAttribute('d', 'M310.6 361.4c12.5 12.5 12.5 32.75 0 45.25C304.4 412.9 296.2 416 288 416s-16.38-3.125-22.62-9.375L160 301.3 54.63 406.6C48.38 412.9 40.19 416 32 416s-16.38-3.125-22.62-9.375c-12.5-12.5-12.5-32.75 0-45.25l105.4-105.4L9.375 150.6c-12.5-12.5-12.5-32.75 0-45.25s32.75-12.5 45.25 0L160 210.8l105.4-105.4c12.5-12.5 32.75-12.5 45.25 0s12.5 32.75 0 45.25l-105.4 105.4L310.6 361.4z');
    svg.appendChild(path);
    return svg;
  }

  // ── Motif rendering (artifact row under the timer) ─────────────────────────
  function renderDisplayMotif(motif) {
    while (motifDotsEl.firstChild) motifDotsEl.removeChild(motifDotsEl.firstChild);
    if (!motif) {
      for (var i = 0; i < 3; i++) {
        var e = document.createElement('div'); e.className = 'motif-d-empty';
        motifDotsEl.appendChild(e);
      }
      return;
    }
    motif.split('').forEach(function (ch) {
      motifDotsEl.appendChild(artifactImg(ch, 'motif-d'));
    });
  }

  // ── Motif reveal overlay ───────────────────────────────────────────────────
  function showMotifReveal(motif) {
    while (revealBallsEl.firstChild) revealBallsEl.removeChild(revealBallsEl.firstChild);
    motif.split('').forEach(function (ch) {
      revealBallsEl.appendChild(artifactImg(ch, 'reveal-ball'));
    });
    revealLabelEl.textContent = 'MOTIF: ' + motif;
    motifRevealEl.classList.add('visible');
    if (revealTimer) clearTimeout(revealTimer);
    revealTimer = setTimeout(function() {
      motifRevealEl.classList.remove('visible');
      revealTimer = null;
    }, 3000);
  }

  // ── Cards ──────────────────────────────────────────────────────────────────
  function setCard(el, count, cls) {
    while (el.firstChild) el.removeChild(el.firstChild);
    if (count > 0) {
      el.textContent = count;
      el.className = 'card-x ' + cls;
    } else {
      el.appendChild(makeXmark());
      el.className = 'card-x';
    }
  }

  function renderCards(ycEl, rcEl, foulEl, scoreObj) {
    var yc = scoreObj && scoreObj.yellow_cards ? scoreObj.yellow_cards.length : 0;
    var rc = scoreObj && scoreObj.red_cards    ? scoreObj.red_cards.length    : 0;
    setCard(ycEl, yc, 'yc');
    setCard(rcEl, rc, 'rc');
    foulEl.textContent = scoreObj && scoreObj.breakdown
      ? ((scoreObj.breakdown.auto_pattern || 0) + (scoreObj.breakdown.teleop_pattern || 0)) : '0';
  }

  // ── Sub-scores ─────────────────────────────────────────────────────────────
  function setSubScores(overflowEl, classifiedEl, pillEl, goalEl, scoreObj) {
    var overflow   = scoreObj ? ((scoreObj.auto_overflow   || 0) + (scoreObj.teleop_overflow   || 0)) : 0;
    var classified = scoreObj ? ((scoreObj.auto_classified || 0) + (scoreObj.teleop_classified || 0)) : 0;
    overflowEl.textContent   = overflow;
    classifiedEl.textContent = classified; // CORRECT: raw count — do NOT divide by 3

    var combined = overflow + classified;
    pillEl.classList.remove('rp-silver', 'rp-gold');
    goalEl.classList.remove('rp1', 'rp2');

    if (ballRpT2 != null && combined >= ballRpT2) {
      pillEl.classList.add('rp-gold');
      goalEl.classList.add('rp2');
      goalEl.textContent = ballRpT2 != null ? '/' + ballRpT2 : '';
    } else if (ballRpT1 != null && combined >= ballRpT1) {
      pillEl.classList.add('rp-silver');
      goalEl.classList.add('rp1');
      // First threshold passed — show second threshold as the next target
      goalEl.textContent = ballRpT2 != null ? '/' + ballRpT2 : '';
    } else {
      goalEl.textContent = ballRpT1 != null ? '/' + ballRpT1 : '';
    }
  }

  // ── Score update ───────────────────────────────────────────────────────────
  function applyScore(data) {
    if (!data) return;
    blueScore.textContent = data.blue && data.blue.total != null ? data.blue.total : '0';
    redScore.textContent  = data.red  && data.red.total  != null ? data.red.total  : '0';
    setSubScores(blueAuto, blueTeleop, blueSubPill, blueGoal, data.blue);
    setSubScores(redAuto,  redTeleop,  redSubPill,  redGoal,  data.red);
    renderCards(blueYcard, blueRcard, blueFoul, data.blue);
    renderCards(redYcard,  redRcard,  redFoul,  data.red);
  }

  // ── State transitions ──────────────────────────────────────────────────────
  function goWaiting() {
    hideResultsScreen();
    hideWinnerAnim();
    reviewing = false;
    postBanner.classList.remove('post-banner--review');
    postBanner.querySelector('.post-title').textContent = 'Match Complete';
    matchActive = false;
    postBanner.classList.remove('visible');
    bluePanel.classList.remove('winner');
    redPanel.classList.remove('winner');
    periodEl.textContent  = '';
    timerEl.textContent   = '0:00';
    timerEl.className     = '';
    blueScore.textContent = '0'; redScore.textContent   = '0';
    blueAuto.textContent  = '0'; blueTeleop.textContent = '0';
    redAuto.textContent   = '0'; redTeleop.textContent  = '0';
    redSubPill.classList.remove('rp-silver', 'rp-gold');
    blueSubPill.classList.remove('rp-silver', 'rp-gold');
    redGoal.classList.remove('rp1', 'rp2');
    blueGoal.classList.remove('rp1', 'rp2');
    redGoal.textContent  = ballRpT1 != null ? '/' + ballRpT1 : '';
    blueGoal.textContent = ballRpT1 != null ? '/' + ballRpT1 : '';
    setCard(blueYcard, 0); setCard(blueRcard, 0);
    setCard(redYcard,  0); setCard(redRcard,  0);
    blueFoul.textContent  = '0'; redFoul.textContent  = '0';
    matchInfoEl.textContent = '—';
    renderDisplayMotif(null);
  }

  function goActive(state) {
    hideResultsScreen();
    hideWinnerAnim();
    reviewing = false;
    postBanner.classList.remove('post-banner--review');
    postBanner.querySelector('.post-title').textContent = 'Match Complete';
    matchActive = true;
    postBanner.classList.remove('visible');
    bluePanel.classList.remove('winner');
    redPanel.classList.remove('winner');
    if (state) SK.applyTimerState(state, timerEl, periodEl);
  }

  function goReview() {
    matchActive = false;
    reviewing = true;
    periodEl.textContent = 'Review';
    timerEl.textContent = '—';
    timerEl.className = '';
    postBanner.classList.add('post-banner--review');
    postBanner.querySelector('.post-title').textContent = 'Under Review';
    postSub.textContent = 'Scores being finalized';
    postBanner.classList.add('visible');
  }

  var winnerAnimEl = document.getElementById('winner-anim');
  var winBannerText = document.getElementById('win-banner-text');
  var winAnimTimers = [];

  var WIN_COLORS = { red: '#ED1C24', blue: '#0066B3', tie: '#FFD700' };

  function hideWinnerAnim() {
    winAnimTimers.forEach(clearTimeout);
    winAnimTimers = [];
    winnerAnimEl.classList.remove('visible', 'filling', 'banner-in');
  }

  function playWinnerAnimation(winner, done) {
    hideWinnerAnim();
    winnerAnimEl.style.setProperty('--win-color', WIN_COLORS[winner] || WIN_COLORS.tie);
    winBannerText.textContent = winner === 'tie' ? 'TIE!' : winner.toUpperCase() + ' WINS!';
    winnerAnimEl.classList.add('visible');
    SK.playBuzzer();
    winAnimTimers.push(setTimeout(function () { winnerAnimEl.classList.add('filling'); }, 150));
    winAnimTimers.push(setTimeout(function () { winnerAnimEl.classList.add('banner-in'); }, 2300));
    winAnimTimers.push(setTimeout(function () {
      if (done) done();                    // results screen fades in underneath (z-index 80 < 90)
      winnerAnimEl.classList.remove('visible');
    }, 4400));
    winAnimTimers.push(setTimeout(hideWinnerAnim, 4900));
  }

  function goComplete() {
    reviewing = false;
    postBanner.classList.remove('post-banner--review');
    postBanner.querySelector('.post-title').textContent = 'Match Complete';
    matchActive = false;
    periodEl.textContent = 'Final';
    timerEl.textContent  = '—';
    timerEl.className    = '';
    var r = parseInt(redScore.textContent,  10) || 0;
    var b = parseInt(blueScore.textContent, 10) || 0;
    bluePanel.classList.remove('winner');
    redPanel.classList.remove('winner');
    if (r > b) {
      redPanel.classList.add('winner');
      postSub.textContent = 'Red Wins  ·  ' + r + ' – ' + b;
    } else if (b > r) {
      bluePanel.classList.add('winner');
      postSub.textContent = 'Blue Wins  ·  ' + b + ' – ' + r;
    } else {
      postSub.textContent = 'Tie  ·  ' + b + ' – ' + r;
    }
    postBanner.classList.add('visible');
  }

  // ── Fetch helpers ──────────────────────────────────────────────────────────
  function fetchQueue() {
    fetch('/api/queue').then(function (r) { return r.ok ? r.json() : null; }).then(function (data) {
      if (!data) return;
      var m = data.onField;
      if (m) {
        redT1.textContent  = (m.red1_team  && m.red1_team.number)  || '—';
        redT2.textContent  = (m.red2_team  && m.red2_team.number)  || '—';
        blueT1.textContent = (m.blue1_team && m.blue1_team.number) || '—';
        blueT2.textContent = (m.blue2_team && m.blue2_team.number) || '—';
        matchInfoEl.textContent = (m.phase === 'playoffs' ? 'Playoff ' : 'Qualification ') +
          m.match_number + (totalMatches ? ' of ' + totalMatches : '');
      }
    }).catch(function () {});
  }

  function fetchMatchCount() {
    fetch('/api/matches').then(function (r) { return r.ok ? r.json() : []; }).then(function (d) {
      totalMatches = (d || []).length;
    }).catch(function () {});
  }

  function fetchEventName() {
    fetch('/api/settings').then(function (r) { return r.ok ? r.json() : null; }).then(function (s) {
      if (!s) return;
      if (s.event_name) eventNameEl.textContent = s.event_name;
      ballRpT1 = parseFloat(s.rp_ball_threshold_1) || null;
      ballRpT2 = parseFloat(s.rp_ball_threshold_2) || null;
      redGoal.textContent  = '/' + ballRpT1;
      blueGoal.textContent = '/' + ballRpT1;
    }).catch(function () {});
  }

  // ── Card highlights on team number boxes ────────────────────────────────────
  function refreshCardHighlights(list) {
    [redT1, redT2, blueT1, blueT2].forEach(function (el) {
      el.classList.remove('carded-yellow', 'carded-red');
    });
    (list || []).forEach(function (p) {
      if (p.type !== 'yellow' && p.type !== 'red') return;
      var teamNum = p.team_number || p.teamNumber;
      if (teamNum == null) return;
      var els = p.alliance === 'red' ? [redT1, redT2] : [blueT1, blueT2];
      els.forEach(function (el) {
        if (parseInt(el.textContent, 10) === teamNum) {
          el.classList.add(p.type === 'yellow' ? 'carded-yellow' : 'carded-red');
        }
      });
    });
  }

  function fetchCardHighlights(matchId) {
    fetch('/api/matches/' + matchId + '/penalties')
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (list) { refreshCardHighlights(list); })
      .catch(function () {});
  }

  // ── Socket ─────────────────────────────────────────────────────────────────
  var socket = SK.connectSocket();
  if (socket) {
    socket.on('timer_tick',    function (state) { if (!matchActive) return; SK.applyTimerState(state, timerEl, null); });
    socket.on('period_change', function (state) { SK.applyTimerState(state, timerEl, periodEl); SK.playBuzzer(); });
    socket.on('match_start',   function (state) { goActive(state); });
    socket.on('match_end',     function ()      { goReview(); });
    socket.on('penalty_added',   function (data) { refreshCardHighlights(data && data.all); });
    socket.on('penalty_removed', function (data) { refreshCardHighlights(data && data.all); });
    socket.on('score_update',  function (data)  {
      if (currentResults) { updateResultsFromScoreUpdate(data); return; }
      if (reviewing) return;
      applyScore(data);
    });
    socket.on('scores_reveal', function (data)  {
      reviewing = false;
      // Scores were frozen during review — sync the overlay with the revealed totals
      if (data && data.red && data.blue) {
        redScore.textContent  = data.red.total;
        blueScore.textContent = data.blue.total;
      }
      goComplete();
      playWinnerAnimation(data && data.winner ? data.winner : 'tie', function () {
        if (data) showResultsScreen(data);
      });
    });
    socket.on('match_loaded',  function (data)  {
      hideResultsScreen();
      hideWinnerAnim();
      postBanner.classList.remove('visible');
      fetchQueue(); fetchMatchCount();
      refreshCardHighlights([]);
      matchActive = false;
      SK.applyTimerState(data, timerEl, periodEl);
      periodEl.textContent = 'Ready';
      periodEl.className   = 'period-label';
    });
    socket.on('match_abort',   function ()      { goWaiting(); fetchQueue(); refreshCardHighlights([]); });
    socket.on('rankings_update', function (rankings) { updateResultsRanks(rankings); });
    socket.on('queue_update',  function ()      { fetchQueue(); fetchMatchCount(); });
    socket.on('motif_update',  function (data)  {
      var motif = data && data.motif ? data.motif : null;
      renderDisplayMotif(motif);
      if (motif && data.reveal) showMotifReveal(motif);
    });
  }

  function fetchTimerState() {
    fetch('/api/timer').then(function (r) { return r.ok ? r.json() : null; }).then(function (state) {
      if (!state || !state.matchId) { goWaiting(); return; }
      fetchCardHighlights(state.matchId);
      if (state.matchEnded && !state.scoresRevealed) {
        fetch('/api/matches/' + state.matchId + '/scores')
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) { if (d) applyScore(Object.assign({ matchId: state.matchId }, d)); goReview(); })
          .catch(function () { goReview(); });
        return;
      }
      if (state.matchEnded && state.scoresRevealed) {
        fetch('/api/matches/' + state.matchId + '/results')
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) { goComplete(); if (d) showResultsScreen(d); })
          .catch(function () { goComplete(); });
        return;
      }
      matchActive = !!(state.running && !state.paused);
      postBanner.classList.remove('visible');
      SK.applyTimerState(state, timerEl, periodEl);
      if (!state.running) {
        periodEl.textContent = 'Ready';
        periodEl.className   = 'period-label';
      }
    }).catch(function () { goWaiting(); });
  }

  // ── Init ───────────────────────────────────────────────────────────────────
  renderDisplayMotif(null);
  fetchEventName();
  fetchQueue();
  fetchMatchCount();
  fetchTimerState();
})();
</script>
</body>
</html>
