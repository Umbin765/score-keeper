<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match Controller — Score Keeper</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* ── Layout ──────────────────────────────────────────────────────────── */
    .ctrl-layout {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: 1rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    /* Wide screens: two columns — pipeline/motif/timer left, live scores right */
    @media (min-width: 1000px) {
      .ctrl-layout {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        align-items: start;
        max-width: 1500px;
      }
      .ctrl-layout > :nth-child(1),
      .ctrl-layout > :nth-child(2),
      .ctrl-layout > :nth-child(3),
      .ctrl-layout > :nth-child(5) { grid-column: 1; }
      .ctrl-layout > :nth-child(4) { grid-column: 2; grid-row: 1 / 6; }
    }

    /* ── Pipeline ─────────────────────────────────────────────────────────── */
    .pipeline-row {
      display: grid;
      grid-template-columns: 5.5rem 1fr auto auto;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 0.85rem;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 0.4rem;
      transition: border-color 0.2s, background 0.2s;
    }
    .pipeline-row:last-child { margin-bottom: 0; }
    .pipeline-row.state-on-field  { border-color: var(--green);  background: #041a0c; }
    .pipeline-row.state-queued    { border-color: var(--yellow); background: var(--yellow-bg); }
    .pipeline-row.is-loaded       { outline: 2px solid var(--blue); outline-offset: 1px; }

    .pipeline-match-num {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text2);
      white-space: nowrap;
    }
    .pipeline-match-num .match-number-val {
      display: block;
      font-size: 1rem;
      color: var(--text);
    }

    .pipeline-teams {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .pipeline-team {
      font-size: 1.05rem;
      font-weight: 800;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
    }
    .pipeline-team.red  { color: var(--red-light);  background: var(--red-bg);  border: 1px solid var(--red-border); }
    .pipeline-team.blue { color: var(--blue-light); background: var(--blue-bg); border: 1px solid var(--blue-border); }
    .pipeline-vs {
      font-size: 0.75rem;
      color: var(--text2);
      font-weight: 600;
      padding: 0 0.1rem;
    }

    .pipeline-state-badge {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      white-space: nowrap;
    }
    .badge-upcoming  { background: var(--bg4); color: var(--text2); }
    .badge-queued    { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow); }
    .badge-on-field  { background: #06230f; color: var(--green); border: 1px solid var(--green); }
    .badge-loaded    { background: var(--blue-bg); color: var(--blue-light); border: 1px solid var(--blue-border); margin-left: 0.35rem; }

    .pipeline-badges { display: flex; align-items: center; gap: 0; flex-wrap: nowrap; }

    .pipeline-actions {
      display: flex;
      gap: 0.4rem;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .pipeline-btn {
      font-size: 0.82rem;
      font-weight: 700;
      padding: 0.5rem 0.8rem;
      border-radius: 7px;
      white-space: nowrap;
      min-height: 38px;
    }
    .pipeline-btn.call-queue { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow); }
    .pipeline-btn.call-queue:hover { background: #221a05; }
    .pipeline-btn.set-field  { background: #06230f; color: var(--green); border: 1px solid var(--green); }
    .pipeline-btn.set-field:hover  { background: #0a3418; }
    .pipeline-btn.load-match { background: var(--blue); color: #fff; border: 1px solid var(--blue-border); }
    .pipeline-btn.load-match:hover { background: #2a7af0; }
    .pipeline-btn.save-match { background: var(--green); color: #000; }
    .pipeline-btn.save-match:hover { background: #2fd870; }
    .pipeline-btn.redo-match { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow); }
    .pipeline-btn.redo-match:hover { background: #221a05; }

    /* ── Motif section ────────────────────────────────────────────────────── */
    .motif-card-inner {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    .motif-pattern {
      display: flex;
      gap: 0.6rem;
      align-items: center;
    }
    .motif-dot {
      width: 3rem;
      height: 3rem;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .motif-dot.G { background: #16c95c; box-shadow: 0 0 10px #16c95c88; }
    .motif-dot.P { background: #9933ff; box-shadow: 0 0 10px #9933ff88; }
    .motif-actions { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .btn-randomize {
      font-size: 0.85rem; font-weight: 700;
      padding: 0.5rem 1rem;
      background: var(--blue); color: #fff;
      border-radius: 6px; border: none;
      transition: background 0.15s, box-shadow 0.15s;
    }
    .btn-randomize:hover { background: #2a7af0; }
    @keyframes motif-warn-pulse {
      0%   { background: var(--red-light); box-shadow: 0 0 0 0 rgba(255,80,80,0.7); }
      50%  { background: #ff3333;          box-shadow: 0 0 0 8px rgba(255,80,80,0); }
      100% { background: var(--red-light); box-shadow: 0 0 0 0 rgba(255,80,80,0); }
    }
    .btn-randomize.motif-warn {
      animation: motif-warn-pulse 0.6s ease 3;
      color: #fff;
    }
    .motif-manual { display: flex; gap: 0.4rem; }
    .btn-motif-pick {
      display: flex;
      gap: 0.3rem;
      align-items: center;
      padding: 0.4rem 0.65rem;
      border-radius: 6px;
      background: var(--bg3);
      border: 1px solid var(--border);
    }
    .btn-motif-pick:hover { border-color: var(--blue-light); }
    .btn-motif-pick.active { border-color: var(--blue-light); background: var(--blue-bg); }
    .btn-motif-pick .mini-dot {
      width: 0.75rem;
      height: 0.75rem;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .btn-motif-pick .mini-dot.G { background: #16c95c; }
    .btn-motif-pick .mini-dot.P { background: #9933ff; }
    .motif-none-msg { color: var(--text2); font-size: 0.9rem; font-style: italic; }

    /* ── Timer section ────────────────────────────────────────────────────── */
    .timer-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      align-items: start;
    }
    .timer-display-wrap { text-align: center; }
    .timer-btns {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-width: 130px;
    }
    .timer-btns button {
      font-size: 0.95rem;
      font-weight: 700;
      padding: 0.55rem 1rem;
      border-radius: 8px;
      min-height: var(--tap);
    }
    .btn-start   { background: var(--green);  color: #000; }
    .btn-start:hover { background: #2fd870; }
    .btn-pause   { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow); }
    .btn-resume  { background: #06230f; color: var(--green); border: 1px solid var(--green); }
    .btn-advance { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }
    .btn-abort   { background: var(--red-bg); color: var(--red-light); border: 1px solid var(--red-border); }
    .timer-btns button:disabled {
      background: var(--bg3) !important;
      color: var(--text2) !important;
      border-color: var(--border) !important;
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* ── Score section ────────────────────────────────────────────────────── */
    .score-summary {
      display: flex;
      gap: 2rem;
      justify-content: center;
      align-items: center;
      margin-bottom: 1rem;
    }
    .score-alloc { text-align: center; }
    .score-alloc .total { font-size: 3.5rem; font-weight: 900; line-height: 1; }
    .score-alloc .label { font-size: 0.75rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 0.2rem; }
    .breakdown-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      padding: 0.2rem 0;
      border-bottom: 1px solid var(--bg3);
    }
    .breakdown-row:last-child { border-bottom: none; }
    .breakdown-label { color: var(--text2); }

    /* ── Loaded match label ───────────────────────────────────────────────── */
    .loaded-label {
      font-size: 0.8rem;
      color: var(--blue-light);
      font-weight: 600;
      margin-top: 0.25rem;
      min-height: 1.2em;
    }

    /* ── Pattern balls (Live Scores card) ────────────────────────────────── */
    .pattern-section {
      margin-top: 0.75rem;
      margin-bottom: 0.25rem;
    }
    .pattern-heading {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text2);
      margin-bottom: 0.5rem;
    }
    .pattern-alliances {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .pattern-col-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.35rem;
    }
    .pattern-col-label.red-text  { color: var(--red-light); }
    .pattern-col-label.blue-text { color: var(--blue-light); }
    .ctrl-pattern-balls {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 0.3rem;
    }
    .ctrl-pattern-ball {
      aspect-ratio: 1;
      width: 100%;
      border-radius: 50%;
      border: 2px solid;
      opacity: 0.25;
      transition: opacity 0.15s;
    }
    .ctrl-pattern-ball.selected { opacity: 1; }

    /* ── Post-match ───────────────────────────────────────────────────────── */
    .commit-card { border-color: var(--green); }
    .commit-card button {
      width: 100%;
      padding: 0.9rem;
      font-size: 1rem;
      font-weight: 700;
      background: var(--green);
      color: #000;
      border-radius: 8px;
    }
    .commit-card button:hover { background: #2fd870; }

    /* ── Next-match popup ─────────────────────────────────────────────────── */
    .nmatch-backdrop {
      display: none;
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.72);
      align-items: center; justify-content: center;
    }
    .nmatch-backdrop.open { display: flex; }
    .nmatch-modal {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 14px; padding: 2rem 1.75rem;
      min-width: 320px; max-width: 440px; width: 90%;
      display: flex; flex-direction: column; gap: 1rem;
    }
    .nmatch-title { font-size: 1.1rem; font-weight: 700; color: var(--text1); }
    .nmatch-sub   { font-size: 0.85rem; color: var(--text2); line-height: 1.5; margin-bottom: 0.25rem; }
    .nmatch-btn {
      width: 100%; padding: 0.85rem 1rem; border-radius: 8px;
      font-size: 0.95rem; font-weight: 700; cursor: pointer; border: none;
      text-align: left;
    }
    .nmatch-btn .btn-desc {
      display: block; font-size: 0.78rem; font-weight: 400; opacity: 0.75; margin-top: 0.2rem;
    }
    .nmatch-btn.save   { background: var(--green); color: #000; }
    .nmatch-btn.save:hover { background: #2fd870; }
    .nmatch-btn.redo   { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow); }
    .nmatch-btn.redo:hover { background: #221a05; }
    .nmatch-btn.cancel { background: transparent; color: var(--text2); border: 1px solid var(--border); text-align: center; }
    .nmatch-btn.cancel:hover { background: var(--bg3); }
  </style>
</head>
<body>

  <header class="page-header" id="page-header">
    <span class="page-title">Match Controller</span>
  </header>

  <div class="ctrl-layout" id="ctrl-layout"></div>

  <!-- ── Next-match popup ──────────────────────────────────────────────────── -->
  <div id="nmatch-backdrop" class="nmatch-backdrop">
    <div class="nmatch-modal">
      <div class="nmatch-title" id="nmatch-title">Loading next match</div>
      <div class="nmatch-sub"  id="nmatch-sub">What do you want to do with the current match?</div>
      <button class="nmatch-btn save"   id="nmatch-save">
        Save the Game
        <span class="btn-desc">Scores are final — match won't appear in the pipeline again</span>
      </button>
      <button class="nmatch-btn redo"   id="nmatch-redo">
        Mark as Redo
        <span class="btn-desc">Reset to 0-0 — match returns to the pipeline for a replay</span>
      </button>
      <button class="nmatch-btn cancel" id="nmatch-cancel">Cancel</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script>
  (function () {
    'use strict';

    // ── State ──────────────────────────────────────────────────────────────────
    var MOTIFS = ['GPP', 'PGP', 'PPG'];

    // Ball colours derived from match motif (G = green, P = purple)
    var BALL_G    = { bg: '#16c95c', bd: '#16c95c' };
    var BALL_P    = { bg: '#9933ff', bd: '#9933ff' };
    var BALL_NONE = { bg: '#445566', bd: '#445566' };

    function getBallColor(idx, motif) {
      if (!motif || motif.length !== 3) return BALL_NONE;
      var ch = motif[idx % 3];
      return ch === 'G' ? BALL_G : ch === 'P' ? BALL_P : BALL_NONE;
    }

    var state = {
      matches: [],
      loadedMatchId: null,
      timerState: null,
      matchEnded: false,
      scoresRevealed: false,
      currentMotif: null,
      motifLocked: false,
      redPatternBalls: '000000000',
      bluePatternBalls: '000000000',
    };

    // ── Auth ───────────────────────────────────────────────────────────────────
    SK.mountPinPad('control', 'Match Controller').then(function () {
      SK.addLogoutButton(document.getElementById('page-header'));
      buildLayout();
      fetchAll();
      connectSocket();
    });

    // ── DOM refs ───────────────────────────────────────────────────────────────
    var layout;
    var pipelineList;
    var motifPatternEl, motifPickBtns;
    var periodLabelEl, timerEl, loadedLabel;
    var startBtn, pauseBtn, resumeBtn, abortBtn, advanceBtn, revealBtn;
    var redTotal, blueTotal, redBreakdown, blueBreakdown;
    var redRpPanel, blueRpPanel;
    var redPatternRow, bluePatternRow;   // 9-element NodeLists filled at build time
    var commitCard;

    // ── Next-match popup ───────────────────────────────────────────────────────
    var pendingLoadMatchId = null;
    var nmatchBackdrop = document.getElementById('nmatch-backdrop');
    var nmatchTitle    = document.getElementById('nmatch-title');
    var nmatchSub      = document.getElementById('nmatch-sub');

    function openNmatchPopup(currentMatchId, nextMatchId) {
      pendingLoadMatchId = nextMatchId;
      var cur = state.matches.find(function (m) { return m.id === currentMatchId; });
      nmatchTitle.textContent = 'Loading Match ' + (cur ? cur.match_number : '') + ' — what happens to the current match?';
      nmatchBackdrop.classList.add('open');
    }
    function closeNmatchPopup() {
      nmatchBackdrop.classList.remove('open');
      pendingLoadMatchId = null;
    }

    document.getElementById('nmatch-save').addEventListener('click', function () {
      var curId = state.loadedMatchId;
      var nextId = pendingLoadMatchId;
      closeNmatchPopup();
      fetch('/api/matches/' + curId + '/commit', { method: 'POST' })
        .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
        .then(function () {
          showToast('Match saved', 'success');
          doLoadMatch(nextId);
        })
        .catch(function () { showToast('Failed to save match', 'error'); });
    });

    document.getElementById('nmatch-redo').addEventListener('click', function () {
      var curId = state.loadedMatchId;
      var nextId = pendingLoadMatchId;
      closeNmatchPopup();
      fetch('/api/matches/' + curId + '/replay', { method: 'POST' })
        .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
        .then(function () {
          showToast('Match marked as redo — scores reset', 'success');
          doLoadMatch(nextId);
        })
        .catch(function () { showToast('Failed to reset match', 'error'); });
    });

    document.getElementById('nmatch-cancel').addEventListener('click', closeNmatchPopup);
    nmatchBackdrop.addEventListener('click', function (e) {
      if (e.target === nmatchBackdrop) closeNmatchPopup();
    });

    // ── Build full layout ──────────────────────────────────────────────────────
    function buildLayout() {
      layout = document.getElementById('ctrl-layout');

      // 1. Match Pipeline card
      var pipelineCard = makeCard('Match Pipeline');
      pipelineList = document.createElement('div');
      pipelineList.id = 'pipeline-list';
      pipelineCard.appendChild(pipelineList);
      layout.appendChild(pipelineCard);

      // 2. Motif card
      var motifCard = makeCard('Match Motif');
      // Add a lock badge to the card header
      var motifCardH2 = motifCard.querySelector('h2');
      var lockTag = document.createElement('span');
      lockTag.id = 'motif-lock-tag';
      lockTag.textContent = 'Locked — match in progress';
      lockTag.style.cssText = 'display:none;font-size:0.7rem;font-weight:600;color:var(--red-light);background:var(--red-bg);border:1px solid var(--red-border);border-radius:4px;padding:0.15rem 0.5rem;margin-left:0.75rem;vertical-align:middle;';
      motifCardH2.appendChild(lockTag);

      var motifInner = document.createElement('div');
      motifInner.className = 'motif-card-inner';

      // 3 colored balls
      motifPatternEl = document.createElement('div');
      motifPatternEl.className = 'motif-pattern';

      // Actions
      var motifActionsEl = document.createElement('div');
      motifActionsEl.className = 'motif-actions';

      var randomizeBtn = document.createElement('button');
      randomizeBtn.className = 'btn-randomize';
      randomizeBtn.textContent = 'Randomize';
      randomizeBtn.addEventListener('click', randomizeMotif);
      motifActionsEl.appendChild(randomizeBtn);

      var manualEl = document.createElement('div');
      manualEl.className = 'motif-manual';
      motifPickBtns = {};
      MOTIFS.forEach(function (m) {
        var btn = document.createElement('button');
        btn.className = 'btn-motif-pick';
        // Show 3 mini colored dots instead of text
        m.split('').forEach(function (ch) {
          var d = document.createElement('span');
          d.className = 'mini-dot ' + ch;
          btn.appendChild(d);
        });
        btn.addEventListener('click', function () { setMotif(m); });
        motifPickBtns[m] = btn;
        manualEl.appendChild(btn);
      });
      motifActionsEl.appendChild(manualEl);

      motifInner.appendChild(motifPatternEl);
      motifInner.appendChild(motifActionsEl);
      motifCard.appendChild(motifInner);
      layout.appendChild(motifCard);
      renderMotif(null); // show empty state

      // 3. Timer card
      var timerCard = makeCard('Timer');
      var timerInner = document.createElement('div');
      timerInner.className = 'timer-card';

      var timerLeft = document.createElement('div');
      timerLeft.className = 'timer-display-wrap';
      periodLabelEl = document.createElement('div');
      periodLabelEl.className = 'period-label';
      periodLabelEl.textContent = 'Waiting';
      timerEl = document.createElement('div');
      timerEl.className = 'timer-display';
      timerEl.textContent = '0:00';
      loadedLabel = document.createElement('div');
      loadedLabel.className = 'loaded-label';
      timerLeft.appendChild(periodLabelEl);
      timerLeft.appendChild(timerEl);
      timerLeft.appendChild(loadedLabel);

      var timerBtnsEl = document.createElement('div');
      timerBtnsEl.className = 'timer-btns';
      startBtn   = makeTBtn('Start',          'btn-start',   handleStart);
      pauseBtn   = makeTBtn('Pause',          'btn-pause',   handlePause);
      resumeBtn  = makeTBtn('Resume',         'btn-resume',  handleResume);
      advanceBtn = makeTBtn('Advance Period', 'btn-advance', handleAdvance);
      abortBtn   = makeTBtn('Abort',          'btn-abort',   handleAbort);
      timerBtnsEl.appendChild(startBtn);
      timerBtnsEl.appendChild(pauseBtn);
      timerBtnsEl.appendChild(resumeBtn);
      timerBtnsEl.appendChild(advanceBtn);
      timerBtnsEl.appendChild(abortBtn);

      timerInner.appendChild(timerLeft);
      timerInner.appendChild(timerBtnsEl);
      timerCard.appendChild(timerInner);
      layout.appendChild(timerCard);

      // 3. Live Scores card
      var scoresCard = makeCard('Live Scores');

      var scoreSummary = document.createElement('div');
      scoreSummary.className = 'score-summary';

      var redAlloc = document.createElement('div');
      redAlloc.className = 'score-alloc';
      redTotal = document.createElement('div');
      redTotal.className = 'total red-text';
      redTotal.textContent = '0';
      var redLbl = document.createElement('div');
      redLbl.className = 'label';
      redLbl.textContent = 'RED';
      redAlloc.appendChild(redTotal);
      redAlloc.appendChild(redLbl);

      var vsEl = document.createElement('div');
      vsEl.className = 'vs-divider';
      vsEl.textContent = 'VS';

      var blueAlloc = document.createElement('div');
      blueAlloc.className = 'score-alloc';
      blueTotal = document.createElement('div');
      blueTotal.className = 'total blue-text';
      blueTotal.textContent = '0';
      var blueLbl = document.createElement('div');
      blueLbl.className = 'label';
      blueLbl.textContent = 'BLUE';
      blueAlloc.appendChild(blueTotal);
      blueAlloc.appendChild(blueLbl);

      scoreSummary.appendChild(redAlloc);
      scoreSummary.appendChild(vsEl);
      scoreSummary.appendChild(blueAlloc);
      scoresCard.appendChild(scoreSummary);

      // Pattern balls section
      var patternSection = document.createElement('div');
      patternSection.className = 'pattern-section';
      var patternHeading = document.createElement('div');
      patternHeading.className = 'pattern-heading';
      patternHeading.textContent = 'Pattern Balls';
      patternSection.appendChild(patternHeading);
      var patternAlliances = document.createElement('div');
      patternAlliances.className = 'pattern-alliances';

      function makePatternCol(colorCls) {
        var col = document.createElement('div');
        var colLbl = document.createElement('div');
        colLbl.className = 'pattern-col-label ' + colorCls + '-text';
        colLbl.textContent = colorCls.toUpperCase();
        col.appendChild(colLbl);
        var row = document.createElement('div');
        row.className = 'ctrl-pattern-balls';
        for (var bi = 0; bi < 9; bi++) {
          var ball = document.createElement('div');
          ball.className = 'ctrl-pattern-ball';
          var c = getBallColor(bi, state.currentMotif);
          ball.style.background  = c.bg;
          ball.style.borderColor = c.bd;
          row.appendChild(ball);
        }
        col.appendChild(row);
        return { col: col, ballRow: row };
      }

      var redCol  = makePatternCol('red');
      var blueCol = makePatternCol('blue');
      redPatternRow  = redCol.ballRow;
      bluePatternRow = blueCol.ballRow;
      patternAlliances.appendChild(redCol.col);
      patternAlliances.appendChild(blueCol.col);
      patternSection.appendChild(patternAlliances);
      scoresCard.appendChild(patternSection);

      var rpGrid = document.createElement('div');
      rpGrid.className = 'grid-2';
      redRpPanel  = document.createElement('div');
      blueRpPanel = document.createElement('div');
      redRpPanel.className  = 'card red-panel';
      blueRpPanel.className = 'card blue-panel';
      rpGrid.appendChild(redRpPanel);
      rpGrid.appendChild(blueRpPanel);
      scoresCard.appendChild(rpGrid);

      var bdGrid = document.createElement('div');
      bdGrid.className = 'grid-2';
      redBreakdown  = document.createElement('div');
      blueBreakdown = document.createElement('div');
      redBreakdown.className  = 'card red-panel';
      blueBreakdown.className = 'card blue-panel';
      bdGrid.appendChild(redBreakdown);
      bdGrid.appendChild(blueBreakdown);
      scoresCard.appendChild(bdGrid);
      layout.appendChild(scoresCard);

      // 4. Post-match commit card
      commitCard = makeCard('Post-Match');
      commitCard.className += ' commit-card hidden';
      revealBtn = document.createElement('button');
      revealBtn.textContent = 'Show Scores on Display';
      revealBtn.className = 'btn-start';
      revealBtn.addEventListener('click', revealScores);
      commitCard.appendChild(revealBtn);
      var commitBtn = document.createElement('button');
      commitBtn.textContent = 'Commit Scores & Save Results';
      commitBtn.addEventListener('click', commitScores);
      commitCard.appendChild(commitBtn);
      layout.appendChild(commitCard);
    }

    function makeCard(title) {
      var card = document.createElement('div');
      card.className = 'card';
      var h2 = document.createElement('h2');
      h2.textContent = title;
      card.appendChild(h2);
      return card;
    }

    function makeTBtn(label, cls, handler) {
      var btn = document.createElement('button');
      btn.className = cls;
      btn.textContent = label;
      btn.addEventListener('click', handler);
      return btn;
    }

    // ── Fetch helpers ──────────────────────────────────────────────────────────
    function fetchAll() {
      fetchMatches();
      fetchTimerState();
    }

    function fetchMatches() {
      fetch('/api/matches')
        .then(function (r) { return r.json(); })
        .then(function (matches) {
          state.matches = matches;
          renderPipeline();
        })
        .catch(function () { showToast('Failed to load matches', 'error'); });
    }

    // ── Motif ──────────────────────────────────────────────────────────────────
    function renderMotif(motif) {
      state.currentMotif = motif;
      applyMotifToPatternBalls(motif);

      MOTIFS.forEach(function (m) {
        if (motifPickBtns[m]) motifPickBtns[m].classList.toggle('active', m === motif);
      });

      while (motifPatternEl.firstChild) motifPatternEl.removeChild(motifPatternEl.firstChild);

      if (!motif) {
        var msg = document.createElement('span');
        msg.className = 'motif-none-msg';
        msg.textContent = 'Not set — randomize before match start';
        motifPatternEl.appendChild(msg);
        return;
      }

      // 3 colored balls
      motif.split('').forEach(function (ch) {
        var dot = document.createElement('div');
        dot.className = 'motif-dot ' + ch;
        motifPatternEl.appendChild(dot);
      });
    }

    function applyMotifToPatternBalls(motif) {
      var balls = document.querySelectorAll('.ctrl-pattern-ball');
      for (var i = 0; i < balls.length; i++) {
        var c = getBallColor(i % 9, motif);
        balls[i].style.background  = c.bg;
        balls[i].style.borderColor = c.bd;
      }
    }

    function setMotifLocked(locked) {
      state.motifLocked = locked;
      var randomizeBtns = document.querySelectorAll('.btn-randomize');
      randomizeBtns.forEach(function (b) { b.disabled = locked; });
      MOTIFS.forEach(function (m) {
        if (motifPickBtns[m]) motifPickBtns[m].disabled = locked;
      });
      var lockTag = document.getElementById('motif-lock-tag');
      if (lockTag) lockTag.style.display = locked ? 'inline-block' : 'none';
    }

    function updateTimerButtons(ts) {
      if (!startBtn) return;
      var running = !!(ts && ts.running);
      var paused  = !!(ts && ts.paused);
      var matchId = !!(ts && ts.matchId);
      var ended   = !!(ts && ts.matchEnded) || state.matchEnded;

      // Start: only when a match is loaded and hasn't started or ended yet
      startBtn.disabled  = !matchId || running || ended;
      // Pause: only when actively running
      pauseBtn.disabled  = !running || paused;
      // Resume: only when paused
      resumeBtn.disabled = !paused;
      // Advance/Abort: when a match is in progress (started but not ended)
      var inProgress = matchId && (running || paused) && !ended;
      advanceBtn.disabled = !inProgress;
      abortBtn.disabled   = !inProgress;
    }

    function randomizeMotif() {
      if (!state.loadedMatchId) { showToast('Load a match first', 'error'); return; }
      if (state.motifLocked)    { showToast('Match in progress — motif is locked', 'error'); return; }
      fetch('/api/matches/' + state.loadedMatchId + '/motif/randomize', { method: 'POST' })
        .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
        .then(function (data) {
          renderMotif(data.motif);
          showToast('Motif: ' + data.motif, 'success');
        })
        .catch(function () { showToast('Failed to randomize motif', 'error'); });
    }

    function setMotif(motif) {
      if (!state.loadedMatchId) { showToast('Load a match first', 'error'); return; }
      if (state.motifLocked)    { showToast('Match in progress — motif is locked', 'error'); return; }
      fetch('/api/matches/' + state.loadedMatchId + '/motif', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ motif: motif }),
      })
        .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
        .then(function (data) {
          renderMotif(data.motif);
          showToast('Motif set: ' + data.motif, 'success');
        })
        .catch(function () { showToast('Failed to set motif', 'error'); });
    }

    function fetchTimerState() {
      fetch('/api/timer')
        .then(function (r) { return r.json(); })
        .then(function (ts) {
          state.timerState = ts;
          if (ts.matchEnded) state.matchEnded = true;
          state.scoresRevealed = !!ts.scoresRevealed;
          if (ts.matchEnded) commitCard.classList.remove('hidden');
          updateRevealBtn();
          SK.applyTimerState(ts, timerEl, periodLabelEl);
          updateTimerButtons(ts);
          if (ts.matchId) {
            state.loadedMatchId = ts.matchId;
            updateLoadedLabel(ts.matchId);
            fetchScores(ts.matchId);
            // Restore motif from loaded match
            fetch('/api/matches/' + ts.matchId)
              .then(function (r) { return r.json(); })
              .then(function (m) { renderMotif(m.motif || null); })
              .catch(function () {});
            renderPipeline();
          }
        })
        .catch(function () {});
    }

    function fetchScores(matchId) {
      fetch('/api/matches/' + matchId + '/scores')
        .then(function (r) { return r.json(); })
        .then(function (data) { renderScores(data); })
        .catch(function () {});
    }

    // ── Pipeline ───────────────────────────────────────────────────────────────
    function renderPipeline() {
      if (!pipelineList) return;
      while (pipelineList.firstChild) pipelineList.removeChild(pipelineList.firstChild);

      var pipeline = state.matches
        .filter(function (m) { return m.state !== 'COMPLETED'; })
        .slice(0, 5);

      if (!pipeline.length) {
        var msg = document.createElement('div');
        msg.style.cssText = 'color:var(--text2);font-size:0.9rem;padding:0.5rem 0;';
        msg.textContent = 'No upcoming matches.';
        pipelineList.appendChild(msg);
        return;
      }

      pipeline.forEach(function (m) {
        pipelineList.appendChild(makePipelineRow(m));
      });
    }

    function makePipelineRow(m) {
      var stateKey = (m.state || 'UPCOMING').toLowerCase().replace('_', '-');
      var isLoaded = state.loadedMatchId && state.loadedMatchId === m.id;

      var row = document.createElement('div');
      row.className = 'pipeline-row state-' + stateKey + (isLoaded ? ' is-loaded' : '');

      // Column 1: match number
      var numCol = document.createElement('div');
      numCol.className = 'pipeline-match-num';
      var numLabel = document.createElement('span');
      numLabel.textContent = 'Match';
      var numVal = document.createElement('span');
      numVal.className = 'match-number-val';
      numVal.textContent = m.match_number;
      numCol.appendChild(numLabel);
      numCol.appendChild(numVal);

      // Column 2: teams
      var teamsCol = document.createElement('div');
      teamsCol.className = 'pipeline-teams';

      function addTeamEl(team, color) {
        var el = document.createElement('span');
        el.className = 'pipeline-team ' + color;
        el.textContent = team ? team.number : '?';
        teamsCol.appendChild(el);
      }
      function addVs() {
        var el = document.createElement('span');
        el.className = 'pipeline-vs';
        el.textContent = 'vs';
        teamsCol.appendChild(el);
      }

      addTeamEl(m.red1_team,  'red');
      addTeamEl(m.red2_team,  'red');
      addVs();
      addTeamEl(m.blue1_team, 'blue');
      addTeamEl(m.blue2_team, 'blue');

      // Column 3: state badge(s)
      var badgesCol = document.createElement('div');
      badgesCol.className = 'pipeline-badges';

      var badge = document.createElement('span');
      badge.className = 'pipeline-state-badge badge-' + stateKey;
      badge.textContent = (m.state || 'UPCOMING').replace('_', ' ');
      badgesCol.appendChild(badge);

      if (isLoaded) {
        var loadedTag = document.createElement('span');
        loadedTag.className = 'pipeline-state-badge badge-loaded';
        loadedTag.textContent = 'LOADED';
        badgesCol.appendChild(loadedTag);
      }

      // Column 4: action buttons
      var actionsCol = document.createElement('div');
      actionsCol.className = 'pipeline-actions';

      if (m.state === 'UPCOMING') {
        var callBtn = document.createElement('button');
        callBtn.className = 'pipeline-btn call-queue';
        callBtn.textContent = 'Call to Queue';
        callBtn.addEventListener('click', function () { setMatchState(m.id, 'QUEUED'); });
        actionsCol.appendChild(callBtn);
      }

      if (m.state === 'QUEUED') {
        var fieldBtn = document.createElement('button');
        fieldBtn.className = 'pipeline-btn set-field';
        fieldBtn.textContent = 'Set On Field';
        fieldBtn.addEventListener('click', function () { setMatchState(m.id, 'ON_FIELD'); });
        actionsCol.appendChild(fieldBtn);
      }

      if (m.state === 'ON_FIELD' && !isLoaded) {
        var loadBtn = document.createElement('button');
        loadBtn.className = 'pipeline-btn load-match';
        loadBtn.textContent = 'Load Match';
        loadBtn.addEventListener('click', function () { loadMatch(m.id); });
        actionsCol.appendChild(loadBtn);

        // Quick-resolve buttons: commit or replay without loading
        var saveBtn = document.createElement('button');
        saveBtn.className = 'pipeline-btn save-match';
        saveBtn.textContent = 'Save';
        (function (mid) {
          saveBtn.addEventListener('click', function () {
            fetch('/api/matches/' + mid + '/commit', { method: 'POST' })
              .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
              .then(function () { showToast('Match saved', 'success'); fetchMatches(); })
              .catch(function () { showToast('Failed to save match', 'error'); });
          });
        })(m.id);
        actionsCol.appendChild(saveBtn);

        var redoBtn = document.createElement('button');
        redoBtn.className = 'pipeline-btn redo-match';
        redoBtn.textContent = 'Redo';
        (function (mid) {
          redoBtn.addEventListener('click', function () {
            fetch('/api/matches/' + mid + '/replay', { method: 'POST' })
              .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
              .then(function () { showToast('Match reset to 0-0', 'success'); fetchMatches(); })
              .catch(function () { showToast('Failed to reset match', 'error'); });
          });
        })(m.id);
        actionsCol.appendChild(redoBtn);
      }

      row.appendChild(numCol);
      row.appendChild(teamsCol);
      row.appendChild(badgesCol);
      row.appendChild(actionsCol);
      return row;
    }

    // ── Match actions ──────────────────────────────────────────────────────────
    function setMatchState(matchId, newState) {
      fetch('/api/matches/' + matchId + '/state', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ state: newState }),
      })
        .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
        .then(function () {
          showToast(newState === 'QUEUED' ? 'Called to queue' : 'Set on field', 'success');
          fetchMatches();
        })
        .catch(function () { showToast('Failed to update state', 'error'); });
    }

    function loadMatch(matchId) {
      // If a different match is already loaded, ask what to do with it first
      if (state.loadedMatchId && state.loadedMatchId !== matchId) {
        openNmatchPopup(state.loadedMatchId, matchId);
        return;
      }
      doLoadMatch(matchId);
    }

    function doLoadMatch(matchId) {
      fetch('/api/matches/' + matchId + '/load', { method: 'POST' })
        .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
        .then(function () {
          state.loadedMatchId = matchId;
          state.matchEnded = false;
          commitCard.classList.add('hidden');
          updateLoadedLabel(matchId);
          showToast('Match loaded', 'success');
          // Apply existing motif if this match already has one
          var m = state.matches.find(function (x) { return x.id === matchId; });
          renderMotif(m && m.motif ? m.motif : null);
          fetchMatches();
          fetchScores(matchId);
        })
        .catch(function () { showToast('Failed to load match', 'error'); });
    }

    function updateLoadedLabel(matchId) {
      if (!loadedLabel) return;
      var m = state.matches.find(function (x) { return x.id === matchId; });
      if (!m) { loadedLabel.textContent = ''; return; }
      var rn = function (t) { return t ? t.number : '?'; };
      loadedLabel.textContent = 'Match ' + m.match_number +
        ' — R:' + rn(m.red1_team) + '/' + rn(m.red2_team) +
        ' vs B:' + rn(m.blue1_team) + '/' + rn(m.blue2_team);
    }

    // ── Timer controls ─────────────────────────────────────────────────────────
    function timerPost(endpoint) {
      return fetch('/api/timer/' + endpoint, { method: 'POST' })
        .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
        .catch(function (e) { showToast('Timer error: ' + e.message, 'error'); });
    }

    function handleStart() {
      if (!state.currentMotif) {
        showToast('Set the match motif before starting', 'error');
        document.querySelector('.btn-randomize').classList.add('motif-warn');
        setTimeout(function () {
          var b = document.querySelector('.btn-randomize');
          if (b) b.classList.remove('motif-warn');
        }, 1800);
        return;
      }
      timerPost('start');
    }
    function handlePause()   { timerPost('pause'); }
    function handleResume()  { timerPost('resume'); }
    function handleAdvance() { timerPost('advance'); }
    function handleAbort() {
      if (!confirm('Abort the current match timer?')) return;
      timerPost('abort');
    }

    // ── Score display ──────────────────────────────────────────────────────────
    function renderScores(data) {
      if (!data) return;
      var red  = data.red  || {};
      var blue = data.blue || {};
      redTotal.textContent  = red.total  != null ? red.total  : 0;
      blueTotal.textContent = blue.total != null ? blue.total : 0;
      renderBreakdown(redBreakdown,  red,  'RED');
      renderBreakdown(blueBreakdown, blue, 'BLUE');
      if (red.pattern_balls  != null) applyPatternRow(redPatternRow,  red.pattern_balls);
      if (blue.pattern_balls != null) applyPatternRow(bluePatternRow, blue.pattern_balls);
      renderRpPanel(redRpPanel,  data.redRP  || {}, 'RED');
      renderRpPanel(blueRpPanel, data.blueRP || {}, 'BLUE');
    }

    function applyPatternRow(rowEl, ballsStr) {
      if (!rowEl) return;
      var balls = rowEl.querySelectorAll('.ctrl-pattern-ball');
      for (var i = 0; i < balls.length; i++) {
        balls[i].className = 'ctrl-pattern-ball' + (ballsStr[i] === '1' ? ' selected' : '');
      }
    }

    function renderBreakdown(el, scores, label) {
      while (el.firstChild) el.removeChild(el.firstChild);
      var title = document.createElement('div');
      title.style.cssText = 'font-weight:700;margin-bottom:0.5rem;font-size:0.9rem;';
      title.textContent = label;
      el.appendChild(title);

      var pts = scores.ptsBreakdown || {};
      var fields = [
        ['Auto Classified',   'auto_classified'],
        ['Auto Overflow',     'auto_overflow'],
        ['Auto Leave',        'auto_leave'],
        ['Auto Pattern',      'auto_pattern'],
        ['Teleop Classified', 'teleop_classified'],
        ['Teleop Overflow',   'teleop_overflow'],
        ['Teleop Pattern',    'teleop_pattern'],
        ['Park',              'park'],
        ['Penalties',         'penalties'],
      ];
      fields.forEach(function (f) {
        var row = document.createElement('div');
        row.className = 'breakdown-row';
        var lbl = document.createElement('span');
        lbl.className = 'breakdown-label';
        lbl.textContent = f[0];
        var val = document.createElement('span');
        val.textContent = pts[f[1]] != null ? pts[f[1]] : 0;
        row.appendChild(lbl);
        row.appendChild(val);
        el.appendChild(row);
      });
    }

    function renderRpPanel(el, rpData, label) {
      while (el.firstChild) el.removeChild(el.firstChild);
      var title = document.createElement('div');
      title.style.cssText = 'font-weight:700;margin-bottom:0.5rem;font-size:0.9rem;';
      title.textContent = label + ' RP';
      el.appendChild(title);

      var fields = [
        ['Park RP',    'parkRp'],
        ['Pattern RP', 'patternRp'],
        ['Ball RP',    'ballRp'],
      ];
      fields.forEach(function (f) {
        var row = document.createElement('div');
        row.className = 'breakdown-row';
        var lbl = document.createElement('span');
        lbl.className = 'breakdown-label';
        lbl.textContent = f[0];
        var val = document.createElement('span');
        val.textContent = rpData[f[1]] != null ? rpData[f[1]] : 0;
        row.appendChild(lbl);
        row.appendChild(val);
        el.appendChild(row);
      });

      var totalRow = document.createElement('div');
      totalRow.className = 'breakdown-row';
      totalRow.style.borderTop = '1px solid var(--border)';
      var totalLbl = document.createElement('span');
      totalLbl.className = 'breakdown-label';
      totalLbl.textContent = 'Total RP';
      var totalVal = document.createElement('span');
      totalVal.textContent = rpData.total != null ? rpData.total : 0;
      totalVal.style.fontWeight = '700';
      totalRow.appendChild(totalLbl);
      totalRow.appendChild(totalVal);
      el.appendChild(totalRow);
    }

    // ── Reveal scores ──────────────────────────────────────────────────────────
    function updateRevealBtn() {
      if (!revealBtn) return;
      revealBtn.style.display = state.matchEnded && !state.scoresRevealed ? '' : 'none';
    }

    function revealScores() {
      if (!state.loadedMatchId) { showToast('No match loaded', 'error'); return; }
      fetch('/api/matches/' + state.loadedMatchId + '/reveal', { method: 'POST' })
        .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
        .then(function () { showToast('Scores revealed on display', 'success'); })
        .catch(function () { showToast('Failed to reveal scores', 'error'); });
    }

    // ── Commit scores ──────────────────────────────────────────────────────────
    function commitScores() {
      if (!state.loadedMatchId) { showToast('No match loaded', 'error'); return; }
      fetch('/api/matches/' + state.loadedMatchId + '/commit', { method: 'POST' })
        .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
        .then(function () {
          showToast('Scores committed', 'success');
          commitCard.classList.add('hidden');
          state.matchEnded = false;
          state.scoresRevealed = false;
          updateRevealBtn();
          state.loadedMatchId = null;
          if (loadedLabel) loadedLabel.textContent = '';
          renderMotif(null);
          updateTimerButtons(null);
          fetchMatches();
        })
        .catch(function () { showToast('Failed to commit scores', 'error'); });
    }

    // ── Socket ─────────────────────────────────────────────────────────────────
    function connectSocket() {
      var socket = SK.connectSocket();
      if (!socket) return;

      socket.on('timer_tick', function (ts) {
        state.timerState = ts;
        SK.applyTimerState(ts, timerEl, periodLabelEl);
      });

      socket.on('period_change', function (ts) {
        state.timerState = ts;
        SK.applyTimerState(ts, timerEl, periodLabelEl);
        SK.playBuzzer();
      });

      socket.on('match_start', function (ts) {
        state.matchEnded = false;
        commitCard.classList.add('hidden');
        SK.applyTimerState(ts, timerEl, periodLabelEl);
        setMotifLocked(true);
        updateTimerButtons(ts);
      });

      socket.on('match_paused', function (ts) {
        SK.applyTimerState(ts, timerEl, periodLabelEl);
        updateTimerButtons(ts);
      });

      socket.on('match_resumed', function (ts) {
        SK.applyTimerState(ts, timerEl, periodLabelEl);
        updateTimerButtons(ts);
      });

      socket.on('match_end', function (data) {
        state.matchEnded = true;
        state.scoresRevealed = false;
        commitCard.classList.remove('hidden');
        updateRevealBtn();
        if (data && data.scores) renderScores(data.scores);
        showToast('Match ended — commit scores when ready', 'success');
        updateTimerButtons(data && data.state ? data.state : null);
      });

      socket.on('scores_reveal', function () {
        state.scoresRevealed = true;
        updateRevealBtn();
      });

      socket.on('score_update', function (data) {
        renderScores(data);
      });

      socket.on('match_loaded', function (data) {
        if (data && data.matchId) {
          state.loadedMatchId = data.matchId;
          state.matchEnded = false;
          state.scoresRevealed = false;
          updateRevealBtn();
          updateLoadedLabel(data.matchId);
          renderPipeline();
        }
        setMotifLocked(false);
        updateTimerButtons({ matchId: state.loadedMatchId, running: false, paused: false, matchEnded: false });
        fetchMatches();
        // Update timer display to show the loaded match's initial period and time
        if (data && data.period !== undefined) {
          SK.applyTimerState(
            { running: false, paused: false, matchEnded: false, period: data.period, timeRemaining: data.timeRemaining },
            timerEl,
            periodLabelEl
          );
        }
      });

      socket.on('match_abort', function () {
        setMotifLocked(false);
        state.loadedMatchId = null;
        state.matchEnded = false;
        state.scoresRevealed = false;
        updateRevealBtn();
        commitCard.classList.add('hidden');
        if (loadedLabel) loadedLabel.textContent = '';
        renderMotif(null);
        updateTimerButtons(null);
        fetchMatches();
      });

      socket.on('match_state_change', function () {
        fetchMatches();
      });

      socket.on('queue_update', function () {
        fetchMatches();
      });

      socket.on('motif_update', function (data) {
        // Only update display if it's for the currently loaded match
        if (data && data.matchId === state.loadedMatchId) {
          renderMotif(data.motif);
        }
      });
    }

  })();
  </script>
</body>
</html>
