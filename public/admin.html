<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — Score Keeper</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .tab-bar {
      display: flex; flex-wrap: wrap; gap: 0.25rem;
      padding: 0.75rem 1rem 0; background: var(--bg2);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 50;
    }
    .tab-btn {
      padding: 0.4rem 0.8rem; font-size: 0.85rem; font-weight: 600;
      border-radius: 6px 6px 0 0; border: 1px solid transparent;
      border-bottom: none; background: transparent; color: var(--text2);
    }
    .tab-btn.active {
      background: var(--bg); color: var(--text);
      border-color: var(--border); border-bottom: 1px solid var(--bg);
      margin-bottom: -1px;
    }
    .tab-btn:hover:not(.active) { color: var(--text); background: var(--bg3); }
    .tab-content { display: none; padding: 1rem; }
    .tab-content.active { display: block; }
    .form-row { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.5rem; flex-wrap: wrap; }
    .form-row label { min-width: 160px; font-size: 0.9rem; color: var(--text2); }
    .form-row input, .form-row select { flex: 1; min-width: 100px; }
    .period-row, .period-header {
      display: grid;
      grid-template-columns: 2rem 1fr 60px 100px 80px 80px 2rem 2rem 2rem;
      gap: 0.4rem; align-items: center; padding: 0.4rem 0.5rem;
    }
    .period-header {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text2);
      margin-bottom: 0.25rem;
    }
    .period-row {
      background: var(--bg3); border-radius: 6px; margin-bottom: 0.35rem;
    }
    .period-row .pos-num { color: var(--text2); font-size: 0.85rem; text-align: center; }
    .period-row input, .period-row select { font-size: 0.85rem; padding: 0.2rem 0.4rem; }
    .move-btn { padding: 0.2rem 0.4rem; font-size: 0.8rem; }
    .rm-btn   { padding: 0.2rem 0.4rem; font-size: 0.8rem; color: var(--red-light); border-color: var(--red-border); background: var(--red-bg); }
    .alliance-bracket-row { display: grid; grid-template-columns: 50px 1fr 1fr auto; gap: 0.5rem; align-items: center; margin-bottom: 0.4rem; }
    .alliance-bracket-row label { font-size: 0.85rem; color: var(--text2); }
    .rankings-table-wrap { max-height: 400px; overflow-y: auto; }
    .schedule-table-wrap { max-height: 400px; overflow-y: auto; }
    .export-row { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
    .export-btn { padding: 0.4rem 0.8rem; font-size: 0.85rem; }
    .danger-section { border-color: var(--red-border); background: var(--red-bg); }
    .section-sub { font-size: 0.95rem; font-weight: 700; color: var(--text2); margin: 0.75rem 0 0.4rem; text-transform: uppercase; letter-spacing: 0.06em; }
    input[type="file"] { color: var(--text2); }
    .match-edit-row td { padding: 0; }
    .match-edit-panel { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; margin: 0.25rem 0 0.5rem; padding: 0.9rem; }
    .match-edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem 2rem; }
    .match-edit-col h4 { font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.5rem; }
    .match-edit-col h4.red-text  { color: var(--red-light); }
    .match-edit-col h4.blue-text { color: var(--blue-light); }
    .match-edit-field { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.3rem; font-size: 0.85rem; }
    .match-edit-field label { color: var(--text2); flex: 1; }
    .match-edit-field input[type=number] { width: 70px; text-align: right; }
    .match-edit-cards { margin-top: 0.5rem; }
    .match-edit-cards-title { font-size: 0.72rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.25rem; font-weight: 700; }
    .match-edit-actions { display: flex; gap: 0.5rem; margin-top: 0.85rem; }
    .match-edit-penalties { margin-top: 0.85rem; border-top: 1px solid var(--border); padding-top: 0.75rem; }
    .match-edit-penalties h4 { font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.5rem; color: var(--text2); }
    .penalty-list { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 0.6rem; min-height: 1rem; }
    .penalty-item { display: flex; align-items: center; justify-content: space-between; background: var(--bg3); border-radius: 5px; padding: 0.3rem 0.6rem; font-size: 0.82rem; gap: 0.5rem; }
    .penalty-item .pi-alliance { font-weight: 700; text-transform: uppercase; }
    .penalty-item .pi-alliance.red  { color: var(--red-light); }
    .penalty-item .pi-alliance.blue { color: var(--blue-light); }
    .penalty-item .pi-type { color: var(--text2); flex: 1; }
    .penalty-item .pi-del { padding: 0.1rem 0.4rem; font-size: 0.75rem; color: var(--red-light); border-color: var(--red-border); background: var(--red-bg); }
    .penalty-add-row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body>

  <header class="page-header" id="page-header">
    <span class="page-title">Admin Panel</span>
  </header>

  <nav class="tab-bar" id="tab-bar"></nav>
  <div id="tab-panels"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/xlsx.full.min.js"></script>
  <script src="/js/qrcode.js"></script>
  <script>
  (function () {
    'use strict';

    // ── Auth ───────────────────────────────────────────────────────────────────
    SK.mountPinPad('admin', 'Admin Panel').then(function () {
      SK.addLogoutButton(document.getElementById('page-header'));
      buildTabs();
      fetchAllData();
    });

    // ── Tab system ─────────────────────────────────────────────────────────────
    var TABS = [
      { id: 'teams',    label: 'Teams' },
      { id: 'scoring',  label: 'Scoring Values' },
      { id: 'rp',       label: 'Ranking Points' },
      { id: 'periods',  label: 'Periods' },
      { id: 'schedule', label: 'Schedule' },
      { id: 'matches',  label: 'Matches' },
      { id: 'pins',     label: 'PINs' },
      { id: 'playoffs', label: 'Playoffs' },
      { id: 'cards',    label: 'Cards' },
      { id: 'notes',    label: 'Notes' },
      { id: 'access',   label: 'Access' },
      { id: 'reset',    label: 'Reset' },
    ];

    var panels = {};
    var tabBar  = document.getElementById('tab-bar');
    var tabRoot = document.getElementById('tab-panels');

    function buildTabs() {
      TABS.forEach(function (tab, i) {
        var btn = document.createElement('button');
        btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
        btn.textContent = tab.label;
        btn.dataset.tab = tab.id;
        btn.addEventListener('click', function () { activateTab(tab.id); });
        tabBar.appendChild(btn);

        var panel = document.createElement('div');
        panel.className = 'tab-content' + (i === 0 ? ' active' : '');
        panel.id = 'tab-' + tab.id;
        tabRoot.appendChild(panel);
        panels[tab.id] = panel;
      });

      buildTeamsTab();
      buildScoringTab();
      buildRpTab();
      buildPeriodsTab();
      buildScheduleTab();
      buildMatchesTab();
      buildPinsTab();
      buildPlayoffsTab();
      buildCardsTab();
      buildNotesTab();
      buildAccessTab();
      buildResetTab();
    }

    function activateTab(id) {
      tabBar.querySelectorAll('.tab-btn').forEach(function (b) {
        b.classList.toggle('active', b.dataset.tab === id);
      });
      Object.keys(panels).forEach(function (k) {
        panels[k].classList.toggle('active', k === id);
      });
    }

    // ── Global data state ──────────────────────────────────────────────────────
    var gTeams    = [];
    var gSettings = {};
    var gPeriods  = [];
    var gMatches  = [];
    var gRanked   = [];

    function fetchAllData() {
      fetchTeams();
      fetchSettings();
      fetchPeriods();
      fetchMatches();
    }

    function fetchTeams() {
      fetch('/api/teams')
        .then(function (r) { return r.json(); })
        .then(function (teams) { gTeams = teams; renderTeamsTable(); renderPlayoffsRankings(); })
        .catch(function () {});
    }

    function fetchSettings() {
      fetch('/api/settings')
        .then(function (r) { return r.json(); })
        .then(function (s) { gSettings = s; populateScoringFields(); populateRpFields(); populatePinFields(); })
        .catch(function () {});
    }

    function fetchPeriods() {
      fetch('/api/periods')
        .then(function (r) { return r.json(); })
        .then(function (p) { gPeriods = p || []; renderPeriodsTable(); })
        .catch(function () {});
    }

    function fetchMatches() {
      fetch('/api/matches')
        .then(function (r) { return r.json(); })
        .then(function (m) { gMatches = m || []; renderScheduleTable(); renderMatchesAdminTable(); renderNotesMatchSelect(); renderNotesList(); })
        .catch(function () {});
    }

    // ════════════════════════════════════════════════════════════════════════════
    // TEAMS TAB
    // ════════════════════════════════════════════════════════════════════════════
    var teamsTableBody;

    function buildTeamsTab() {
      var p = panels.teams;

      var addSection = makeAdminSection('Add Team');
      var numInput  = makeInput('number', 'Team Number', '100');
      var nameInput = makeInput('text',   'Team Name',   'Iron Eagles');
      numInput.style.width = '100px';
      var addRow = document.createElement('div');
      addRow.className = 'form-row';
      addRow.appendChild(numInput);
      addRow.appendChild(nameInput);
      var addBtn = document.createElement('button');
      addBtn.textContent = 'Add Team';
      addBtn.addEventListener('click', function () { addTeam(numInput.value, nameInput.value, numInput, nameInput); });
      addRow.appendChild(addBtn);
      addSection.appendChild(addRow);

      // File Import (CSV or Excel)
      var importRow = document.createElement('div');
      importRow.className = 'form-row mt-2';
      var fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = '.csv,.xlsx,.xls';
      var importBtn = document.createElement('button');
      importBtn.textContent = 'Import CSV / Excel';
      importBtn.addEventListener('click', function () { importFile(fileInput); });
      importRow.appendChild(fileInput);
      importRow.appendChild(importBtn);
      addSection.appendChild(importRow);

      p.appendChild(addSection);

      // Teams table
      var tableSection = makeAdminSection('Current Teams');
      var tableWrap = document.createElement('div');
      tableWrap.style.maxHeight = '400px';
      tableWrap.style.overflowY = 'auto';
      var table = document.createElement('table');
      table.className = 'data-table';
      var thead = document.createElement('thead');
      var htr = document.createElement('tr');
      ['#', 'Name', 'OPR', 'Delete'].forEach(function (h) {
        var th = document.createElement('th');
        th.textContent = h;
        htr.appendChild(th);
      });
      thead.appendChild(htr);
      table.appendChild(thead);
      teamsTableBody = document.createElement('tbody');
      table.appendChild(teamsTableBody);
      tableWrap.appendChild(table);
      tableSection.appendChild(tableWrap);
      p.appendChild(tableSection);
    }

    function renderTeamsTable() {
      if (!teamsTableBody) return;
      while (teamsTableBody.firstChild) teamsTableBody.removeChild(teamsTableBody.firstChild);
      gTeams.forEach(function (team) {
        var row = document.createElement('tr');
        var numTd = document.createElement('td');
        numTd.textContent = team.number || team.team_number;
        var nameTd = document.createElement('td');
        nameTd.textContent = team.name;
        var oprTd = document.createElement('td');
        oprTd.textContent = team.opr != null ? Number(team.opr).toFixed(1) : '—';
        oprTd.style.color = 'var(--text2)';
        oprTd.style.textAlign = 'right';
        var delTd = document.createElement('td');
        var delBtn = document.createElement('button');
        delBtn.className = 'danger-btn';
        delBtn.style.fontSize = '0.8rem';
        delBtn.style.padding = '0.2rem 0.5rem';
        delBtn.textContent = 'Delete';
        delBtn.addEventListener('click', function () { deleteTeam(team.id || team.number || team.team_number); });
        delTd.appendChild(delBtn);
        row.appendChild(numTd);
        row.appendChild(nameTd);
        row.appendChild(oprTd);
        row.appendChild(delTd);
        teamsTableBody.appendChild(row);
      });
    }

    function addTeam(num, name, numInput, nameInput) {
      if (!num || !name) { showToast('Fill in team number and name', 'error'); return; }
      fetch('/api/teams', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ number: parseInt(num, 10), name: name }),
      })
        .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
        .then(function () { showToast('Team added', 'success'); numInput.value = ''; nameInput.value = ''; fetchTeams(); })
        .catch(function () { showToast('Failed to add team', 'error'); });
    }

    function deleteTeam(id) {
      if (!confirm('Delete team ' + id + '?')) return;
      fetch('/api/teams/' + id, { method: 'DELETE' })
        .then(function (r) { if (!r.ok) throw new Error(); })
        .then(function () { showToast('Team deleted', 'success'); fetchTeams(); })
        .catch(function () { showToast('Failed to delete', 'error'); });
    }

    function importFile(fileInput) {
      var file = fileInput.files && fileInput.files[0];
      if (!file) { showToast('Select a CSV or Excel file first', 'error'); return; }
      var ext = file.name.split('.').pop().toLowerCase();
      if (ext === 'csv') {
        importFromCsv(file);
      } else if (ext === 'xlsx' || ext === 'xls') {
        importFromExcel(file);
      } else {
        showToast('Unsupported file type. Use .csv, .xlsx or .xls', 'error');
      }
    }

    function sendTeams(teams) {
      if (!teams.length) { showToast('No valid rows found', 'error'); return; }
      fetch('/api/teams/import', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ teams: teams }),
      })
        .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
        .then(function () { showToast('Imported ' + teams.length + ' teams', 'success'); fetchTeams(); })
        .catch(function () { showToast('Import failed', 'error'); });
    }

    function importFromCsv(file) {
      var reader = new FileReader();
      reader.onload = function (e) {
        var lines = e.target.result.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
        var teams = [];
        lines.forEach(function (line, i) {
          if (i === 0 && isNaN(parseInt(line.split(',')[0], 10))) return; // skip header
          var parts = line.split(',');
          var num  = parseInt(parts[0], 10);
          var name = (parts[1] || '').trim().replace(/^"|"$/g, '');
          if (!isNaN(num) && name) teams.push({ number: num, name: name });
        });
        sendTeams(teams);
      };
      reader.readAsText(file);
    }

    function importFromExcel(file) {
      if (typeof XLSX === 'undefined') { showToast('Excel parser not loaded', 'error'); return; }
      var reader = new FileReader();
      reader.onload = function (e) {
        var wb = XLSX.read(e.target.result, { type: 'array' });
        var ws = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
        if (!rows.length) { showToast('Empty spreadsheet', 'error'); return; }

        // Find which columns are team number and name
        var header = rows[0].map(function (h) { return String(h).trim().toLowerCase(); });
        var numCol  = header.findIndex(function (h) { return h.includes('number') || h === 'num' || h === '#'; });
        var nameCol = header.findIndex(function (h) { return h.includes('name'); });

        // Fallback: assume col 0 = number, col 1 = name if headers not found
        if (numCol === -1) numCol  = 0;
        if (nameCol === -1) nameCol = 1;

        var teams = [];
        var startRow = isNaN(parseInt(rows[0][numCol], 10)) ? 1 : 0;
        for (var i = startRow; i < rows.length; i++) {
          var num  = parseInt(rows[i][numCol], 10);
          var name = String(rows[i][nameCol] || '').trim();
          if (!isNaN(num) && num > 0 && name) teams.push({ number: num, name: name });
        }
        sendTeams(teams);
      };
      reader.readAsArrayBuffer(file);
    }

    // ════════════════════════════════════════════════════════════════════════════
    // SCORING VALUES TAB
    // ════════════════════════════════════════════════════════════════════════════
    var SCORING_FIELDS = [
      ['pts_auto_classified',   'Auto: Artifacts Classified'],
      ['pts_auto_overflow',     'Auto: Overflow Artifacts'],
      ['pts_auto_leave',        'Auto: Robot Leave'],
      ['pts_auto_pattern',      'Auto: Pattern Match'],
      ['pts_teleop_classified', 'Teleop: Artifacts Classified'],
      ['pts_teleop_overflow',   'Teleop: Overflow Artifacts'],
      ['pts_park_partial',      'Park: Partial'],
      ['pts_park_full',         'Park: Full'],
      ['pts_park_bonus',        'Park: Bonus'],
      ['pts_foul_minor',        'Penalty: Minor Foul'],
      ['pts_foul_major',        'Penalty: Major Foul'],
    ];

    var scoringInputs = {};

    function buildScoringTab() {
      var p = panels.scoring;
      var section = makeAdminSection('Point Values');
      SCORING_FIELDS.forEach(function (f) {
        var row = document.createElement('div');
        row.className = 'form-row';
        var lbl = document.createElement('label');
        lbl.textContent = f[1];
        var inp = makeInput('number', '', '0');
        inp.style.width = '80px';
        inp.id = 'scoring-' + f[0];
        scoringInputs[f[0]] = inp;
        row.appendChild(lbl);
        row.appendChild(inp);
        section.appendChild(row);
      });
      var saveBtn = document.createElement('button');
      saveBtn.className = 'success-btn mt-2';
      saveBtn.textContent = 'Save Scoring Values';
      saveBtn.addEventListener('click', saveScoringValues);
      section.appendChild(saveBtn);
      p.appendChild(section);
    }

    function populateScoringFields() {
      SCORING_FIELDS.forEach(function (f) {
        var inp = scoringInputs[f[0]];
        if (inp && gSettings[f[0]] != null) inp.value = gSettings[f[0]];
      });
    }

    function saveScoringValues() {
      var payload = {};
      SCORING_FIELDS.forEach(function (f) {
        var v = scoringInputs[f[0]];
        if (v) payload[f[0]] = parseFloat(v.value) || 0;
      });
      putSettings(payload, 'Scoring values saved');
    }

    // ════════════════════════════════════════════════════════════════════════════
    // RANKING POINTS TAB
    // ════════════════════════════════════════════════════════════════════════════
    var RP_FIELDS = [
      ['rp_win',                   'RP: Win'],
      ['rp_tie',                   'RP: Tie'],
      ['rp_loss',                  'RP: Loss'],
      ['rp_park_threshold_1',      'Park RP Threshold 1 (+1 RP)'],
      ['rp_park_threshold_2',      'Park RP Threshold 2 (+2 RP)'],
      ['rp_pattern_threshold_1',   'Pattern RP Threshold 1 (+1 RP)'],
      ['rp_pattern_threshold_2',   'Pattern RP Threshold 2 (+2 RP)'],
      ['rp_ball_threshold_1',      'Ball RP Threshold 1 (+1 RP)'],
      ['rp_ball_threshold_2',      'Ball RP Threshold 2 (+2 RP)'],
      ['matches_per_team',         'Matches per Team'],
    ];

    var rpInputs = {};

    function buildRpTab() {
      var p = panels.rp;
      var section = makeAdminSection('Ranking Point Configuration');
      RP_FIELDS.forEach(function (f) {
        var row = document.createElement('div');
        row.className = 'form-row';
        var lbl = document.createElement('label');
        lbl.textContent = f[1];
        var inp = makeInput('number', '', '0');
        inp.style.width = '80px';
        inp.id = 'rp-' + f[0];
        rpInputs[f[0]] = inp;
        row.appendChild(lbl);
        row.appendChild(inp);
        section.appendChild(row);
      });
      var saveBtn = document.createElement('button');
      saveBtn.className = 'success-btn mt-2';
      saveBtn.textContent = 'Save RP Config';
      saveBtn.addEventListener('click', saveRpValues);
      section.appendChild(saveBtn);
      p.appendChild(section);
    }

    function populateRpFields() {
      RP_FIELDS.forEach(function (f) {
        var inp = rpInputs[f[0]];
        if (inp && gSettings[f[0]] != null) inp.value = gSettings[f[0]];
      });
    }

    function saveRpValues() {
      var payload = {};
      RP_FIELDS.forEach(function (f) {
        var v = rpInputs[f[0]];
        if (v) payload[f[0]] = parseFloat(v.value) || 0;
      });
      putSettings(payload, 'RP config saved');
    }

    function putSettings(payload, successMsg) {
      fetch('/api/settings', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      })
        .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
        .then(function () { showToast(successMsg, 'success'); fetchSettings(); })
        .catch(function () { showToast('Save failed', 'error'); });
    }

    // ════════════════════════════════════════════════════════════════════════════
    // PERIODS TAB
    // ════════════════════════════════════════════════════════════════════════════
    var periodsContainer;
    var PERIOD_TYPES = ['AUTO','TELEOP','ENDGAME','TRANSITION','BUZZER'];

    function buildPeriodsTab() {
      var p = panels.periods;
      var section = makeAdminSection('Period Configuration');

      periodsContainer = document.createElement('div');
      periodsContainer.id = 'periods-container';
      section.appendChild(periodsContainer);

      var addBtn = document.createElement('button');
      addBtn.textContent = '+ Add Period';
      addBtn.className = 'mt-1';
      addBtn.addEventListener('click', function () {
        gPeriods.push({ position: gPeriods.length + 1, name: 'New Period', duration: 30, type: 'AUTO', group_id: null, group_repeats: 1 });
        renderPeriodsTable();
      });

      var saveBtn = document.createElement('button');
      saveBtn.textContent = 'Save Periods';
      saveBtn.className = 'success-btn mt-1';
      saveBtn.style.marginLeft = '0.5rem';
      saveBtn.addEventListener('click', savePeriods);

      var btnRow = document.createElement('div');
      btnRow.className = 'btn-row mt-2';
      btnRow.appendChild(addBtn);
      btnRow.appendChild(saveBtn);
      section.appendChild(btnRow);
      p.appendChild(section);
    }

    function renderPeriodsTable() {
      if (!periodsContainer) return;
      while (periodsContainer.firstChild) periodsContainer.removeChild(periodsContainer.firstChild);

      var hdr = document.createElement('div');
      hdr.className = 'period-header';
      ['#', 'Name', 'Secs', 'Type', 'Group ID', 'Repeats', '', '', ''].forEach(function (label) {
        var cell = document.createElement('span');
        cell.textContent = label;
        hdr.appendChild(cell);
      });
      periodsContainer.appendChild(hdr);

      gPeriods.forEach(function (period, idx) {
        var row = document.createElement('div');
        row.className = 'period-row';

        var pos = document.createElement('span');
        pos.className = 'pos-num';
        pos.textContent = idx + 1;

        var nameInp = makeInput('text', 'Name', 'Period');
        nameInp.value = period.name || '';

    function movePeriod(idx, dir) {
      var other = idx + dir;
      if (other < 0 || other >= gPeriods.length) return;

          group_id: p.group_id || null,

      fetch('/api/periods', {

        headers: { 'Content-Type': 'application/json' },

    function saveMatchAdminEdits(matchId, panel, original, m, editorRow) {
      var requests = [];

      panel.querySelectorAll('input[type=number][data-field]').forEach(function (inp) {
        var a = inp.getAttribute('data-alliance');
        var f = inp.getAttribute('data-field');
        var oldVal = original[a] && original[a].raw ? (original[a].raw[f] != null ? Number(original[a].raw[f]) : 0) : 0;
        var newVal = Number(inp.value) || 0;
        if (newVal !== oldVal) {
          requests.push(fetch('/api/matches/' + matchId + '/override', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ alliance: a, field: f, value: newVal, changedBy: 'admin' }),
          }));
        }
      });

      ['red', 'blue'].forEach(function (a) {
        ['yellow_cards', 'red_cards'].forEach(function (cf) {
          var newCards = [];
          panel.querySelectorAll('input[type=checkbox][data-alliance="' + a + '"][data-card="' + cf + '"]').forEach(function (cb) {
            if (cb.checked) newCards.push(parseInt(cb.getAttribute('data-team'), 10));
          });
          var oldCards = (original[a] && original[a][cf]) || [];
          var changed = newCards.length !== oldCards.length || newCards.some(function (n) { return oldCards.indexOf(n) === -1; });
          if (changed) {
            requests.push(fetch('/api/matches/' + matchId + '/override', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ alliance: a, field: cf, value: newCards, changedBy: 'admin' }),
            }));
          }
        });
      });

      if (!requests.length) { showToast('No changes to save', 'info'); return; }

      Promise.all(requests)
        .then(function (responses) {
          if (responses.every(function (r) { return r.ok; })) {
            showToast('Match ' + m.match_number + ' updated', 'success');
            if (editorRow) editorRow.remove();
          } else {
            showToast('Some saves failed', 'error');
          }
        })
        .catch(function () { showToast('Save failed', 'error'); });
    }

        name.textContent = team.name || '';
        row.appendChild(rank);
        row.appendChild(num);
        row.appendChild(name);
        playoffsRankList.appendChild(row);
      });
      buildAllianceRows();
      renderBracketMatches();
    }

    function fetchAlliances() {
      fetch('/api/alliances')
        .then(function (r) { return r.json(); })
        .then(function (rows) { gAlliances = rows || []; buildAllianceRows(); })
        .catch(function () {});
    }

    function fetchBracket() {
      fetch('/api/bracket')
        .then(function (r) { return r.json(); })
        .then(function (rows) { gBracket = rows || []; renderBracketMatches(); })
        .catch(function () {});
    }

    function connectBracketSocket() {
      var sock = SK.connectSocket();
      if (!sock || sock.__bracketBound) return;
      sock.__bracketBound = true;
      sock.on('bracket_update', function (rows) { gBracket = rows || []; renderBracketMatches(); });
    }

    function buildAllianceRows() {
      if (!playoffsAllianceContainer) return;
      while (playoffsAllianceContainer.firstChild) playoffsAllianceContainer.removeChild(playoffsAllianceContainer.firstChild);

      var count = getAllianceCountClient(gTeams.length);
      for (var i = 1; i <= count; i++) {
        (function (allianceNum) {
          var existing = gAlliances.find(function (a) { return a.alliance_number === allianceNum; });

          var row = document.createElement('div');
          row.className = 'alliance-bracket-row';

          var lbl = document.createElement('div');
          lbl.textContent = 'Alliance ' + allianceNum;
          lbl.style.fontWeight = '700';

          var captainInp = makeInput('number', 'Captain #', existing && existing.captain_number ? existing.captain_number : '');
          var partnerInp = makeInput('number', 'Partner #', existing && existing.partner_number ? existing.partner_number : '');

          var saveBtn = document.createElement('button');
          saveBtn.textContent = 'Save';
          saveBtn.addEventListener('click', function () {
            saveAlliance(allianceNum, captainInp.value, partnerInp.value);
          });

          row.appendChild(lbl);
          row.appendChild(captainInp);
          row.appendChild(partnerInp);
          row.appendChild(saveBtn);
          playoffsAllianceContainer.appendChild(row);
        })(i);
      }
    }

    function initBracket() {
      if (!confirm('Initialize the playoff bracket?')) return;
      fetch('/api/bracket/init', { method: 'POST' })
        .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
        .then(function () { showToast('Bracket initialized', 'success'); fetchBracket(); })
        .catch(function () { showToast('Failed to initialize bracket', 'error'); });
    }

    function saveAlliance(num, captain, partner) {
      if (!captain) { showToast('Enter captain team number', 'error'); return; }
      fetch('/api/alliances', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          alliance_number: num,
          captainNumber: parseInt(captain, 10),
          partnerNumber: parseInt(partner, 10) || null,
        }),
      })
        .then(function (r) { if (!r.ok) return r.json().then(function (e) { throw new Error(e.error); }); return r.json(); })
        .then(function () { showToast('Alliance ' + num + ' saved', 'success'); fetchAlliances(); fetchBracket(); })
        .catch(function (e) { showToast(e.message || 'Save failed', 'error'); });
    }

    // ── Bracket Matches management ─────────────────────────────────────────────

    function bracketRoundLabel(round, slot) {
      return round + ' #' + slot;
    }

    function renderBracketMatches() {
      if (!bracketMatchesContainer) return;
      while (bracketMatchesContainer.firstChild) bracketMatchesContainer.removeChild(bracketMatchesContainer.firstChild);

      if (!gBracket.length) {
        var empty = document.createElement('div');
        empty.style.cssText = 'font-size:0.85rem;color:var(--text2);';
        empty.textContent = 'No bracket yet — click Initialize Bracket above.';
        bracketMatchesContainer.appendChild(empty);
        return;
      }

      gBracket.forEach(function (bm) {
        bracketMatchesContainer.appendChild(buildBracketMatchRow(bm));
      });
    }

    // Options for a side's <select>: fixed seed numbers, plus winner/loser of
    // any bracket match that already has a recorded result.
    function allianceOptionsFor(excludeId) {
      var opts = [{ value: '', label: '— unassigned —' }];
      var count = getAllianceCountClient(gTeams.length);
      for (var i = 1; i <= count; i++) opts.push({ value: String(i), label: 'Alliance ' + i });
      gBracket.forEach(function (bm) {
        if (bm.id === excludeId || bm.winner_alliance == null) return;
        var loserAlliance = bm.winner_alliance === bm.red_alliance ? bm.blue_alliance : bm.red_alliance;
        var label = bracketRoundLabel(bm.bracket_round, bm.bracket_slot);
        opts.push({ value: 'w:' + bm.winner_alliance, label: 'Winner of ' + label });
        if (loserAlliance != null) opts.push({ value: 'l:' + loserAlliance, label: 'Loser of ' + label });
      });
      return opts;
    }

    function buildBracketMatchRow(bm) {
      var row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap;padding:0.5rem 0;border-bottom:1px solid var(--border);';

      var label = document.createElement('div');
      label.style.cssText = 'min-width:110px;font-weight:700;font-size:0.85rem;';
      label.textContent = bracketRoundLabel(bm.bracket_round, bm.bracket_slot);
      row.appendChild(label);

      ['red', 'blue'].forEach(function (side) {
        var current = side === 'red' ? bm.red_alliance : bm.blue_alliance;
        var sel = document.createElement('select');
        sel.style.cssText = 'min-width:150px;' + (side === 'red' ? 'color:var(--red-light);' : 'color:var(--blue-light);');
        allianceOptionsFor(bm.id).forEach(function (o) {
          var opt = document.createElement('option');
          opt.value = o.value;
          opt.textContent = o.label;
          if (current != null && o.value === String(current)) opt.selected = true;
          sel.appendChild(opt);
        });
        sel.disabled = !!bm.match_id;
        sel.addEventListener('change', function () {
          var raw = sel.value;
          var allianceNumber = null;
          if (raw) allianceNumber = raw.indexOf(':') !== -1 ? parseInt(raw.split(':')[1], 10) : parseInt(raw, 10);
          fetch('/api/bracket/matches/' + bm.id + '/assign', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ side: side, allianceNumber: allianceNumber }),
          })
            .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
            .then(function () { showToast(bracketRoundLabel(bm.bracket_round, bm.bracket_slot) + ' ' + side + ' set', 'success'); })
            .catch(function () { showToast('Assign failed', 'error'); });
        });
        row.appendChild(sel);
      });

      var actionSlot = document.createElement('div');
      actionSlot.style.cssText = 'font-size:0.82rem;color:var(--text2);';

      if (bm.match_id) {
        var stateLabel = bm.match_state || 'UPCOMING';
        var scoreLabel = (bm.redScore != null && bm.blueScore != null) ? (' — ' + bm.redScore + '-' + bm.blueScore) : '';
        actionSlot.textContent = 'Match P' + (bm.matchNumber != null ? bm.matchNumber : bm.match_id) + ' (' + stateLabel + ')' + scoreLabel;
        if (bm.winner) {
          var badge = document.createElement('span');
          badge.style.cssText = 'margin-left:0.5rem;color:var(--green);font-weight:700;';
          badge.textContent = bm.winner.toUpperCase() + ' WINS';
          actionSlot.appendChild(badge);
        } else if (stateLabel === 'COMPLETED') {
          // Tie or otherwise unresolved — offer a manual override.
          ['red', 'blue'].forEach(function (side) {
            var btn = document.createElement('button');
            btn.textContent = 'Set ' + side.toUpperCase() + ' winner';
            btn.style.marginLeft = '0.4rem';
            btn.addEventListener('click', function () {
              var winnerAlliance = side === 'red' ? bm.red_alliance : bm.blue_alliance;
              fetch('/api/bracket/matches/' + bm.id + '/winner', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ winnerAlliance: winnerAlliance }),
              })
                .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
                .then(function () { showToast('Winner recorded', 'success'); })
                .catch(function () { showToast('Failed to record winner', 'error'); });
            });
            actionSlot.appendChild(btn);
          });
        }
      } else if (bm.red_alliance != null && bm.blue_alliance != null) {
        var createBtn = document.createElement('button');
        createBtn.className = 'success-btn';
        createBtn.textContent = 'Create Match';
        createBtn.addEventListener('click', function () {
          fetch('/api/bracket/matches/' + bm.id + '/create-match', { method: 'POST' })
            .then(function (r) { if (!r.ok) return r.json().then(function (e) { throw new Error(e.error); }); return r.json(); })
            .then(function (d) { showToast('Match P' + d.matchNumber + ' created', 'success'); })
            .catch(function (e) { showToast(e.message || 'Failed to create match', 'error'); });
        });
        actionSlot.appendChild(createBtn);
      } else {
        actionSlot.textContent = 'Waiting on both sides';
      }

      row.appendChild(actionSlot);
      return row;
    }

    // ════════════════════════════════════════════════════════════════════════════
    // CARDS TAB — outstanding yellow/red cards carried forward across matches
    // within a phase (see team_cards in db.js). Deleting one here is the only
    // way to stop it from carrying into that team's future matches.
    // ════════════════════════════════════════════════════════════════════════════
    var gTeamCards = [];
    var cardsListEl;

    function buildCardsTab() {
      var p = panels.cards;

      var section = makeAdminSection('Outstanding Cards');

      var hint = document.createElement('div');
      hint.style.cssText = 'color:var(--text2);font-size:0.85rem;margin-bottom:0.75rem;';
      hint.textContent = 'A card issued to a team carries into all of that team’s future matches within the same phase (quals/playoffs) until deleted here. Playoffs starting automatically clears any quals cards. Deleting a card does not undo it in the match it was issued in — it only stops it from carrying forward.';
      section.appendChild(hint);

      cardsListEl = document.createElement('div');
      cardsListEl.className = 'notes-list';
      section.appendChild(cardsListEl);

      p.appendChild(section);

      fetchTeamCards();
      connectCardsSocket();
    }

    function fetchTeamCards() {
      fetch('/api/team-cards')
        .then(function (r) { return r.json(); })
        .then(function (cards) { gTeamCards = cards || []; renderCardsList(); })
        .catch(function () {});
    }

    function connectCardsSocket() {
      var sock = SK.connectSocket();
      if (!sock) return;
      sock.on('team_cards_update', function (cards) {
        gTeamCards = cards || [];
        renderCardsList();
      });
    }

    function renderCardsList() {
      if (!cardsListEl) return;
      while (cardsListEl.firstChild) cardsListEl.removeChild(cardsListEl.firstChild);

      if (!gTeamCards.length) {
        var empty = document.createElement('div');
        empty.className = 'note-empty';
        empty.textContent = 'No outstanding cards.';
        cardsListEl.appendChild(empty);
        return;
      }

      gTeamCards.forEach(function (card) {
        var item = document.createElement('div');
        item.className = 'note-item';

        var header = document.createElement('div');
        header.className = 'note-item-header';

        var badge = document.createElement('span');
        badge.className = 'note-item-team ' + (card.card_type === 'red' ? 'red' : 'general');
        badge.style.color = card.card_type === 'red' ? 'var(--red-light)' : 'var(--yellow)';
        badge.textContent = (card.card_type === 'red' ? 'RED' : 'YELLOW') + ' — Team ' + card.team_number
          + (card.team_name ? ' (' + card.team_name + ')' : '');
        header.appendChild(badge);

        var phaseEl = document.createElement('span');
        phaseEl.className = 'note-item-match';
        phaseEl.textContent = (card.phase === 'playoffs' ? 'Playoffs' : 'Quals')
          + (card.origin_match_number ? ' · carried from Match ' + card.origin_match_number : '');
        header.appendChild(phaseEl);

        item.appendChild(header);

        var actions = document.createElement('div');
        actions.className = 'note-item-actions';
        var delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'note-del';
        delBtn.textContent = 'Delete';
        delBtn.addEventListener('click', function () {
          if (!confirm('Stop this card from carrying forward to ' + card.team_number + '’s future matches?')) return;
          fetch('/api/team-cards/' + card.team_number + '/' + card.card_type, { method: 'DELETE' })
            .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
            .then(function () { showToast('Card cleared', 'info'); })
            .catch(function () { showToast('Failed to clear card', 'error'); });
        });
        actions.appendChild(delBtn);
        item.appendChild(actions);

        cardsListEl.appendChild(item);
      });
    }

    // ════════════════════════════════════════════════════════════════════════════
    // NOTES TAB
    // ════════════════════════════════════════════════════════════════════════════
    var gNotes = [];
    var adminSelectedNoteTeam = null; // { alliance, teamNumber } or null for a general note
    var notesMatchSelect, notesTeamPicker, notesTextarea, notesAddBtn, notesSearchInput, notesListEl;

    function buildNotesTab() {
      var p = panels.notes;

      var addSection = makeAdminSection('Add Note');

      notesMatchSelect = document.createElement('select');
      notesMatchSelect.style.marginBottom = '0.75rem';
      notesMatchSelect.addEventListener('change', renderNotesTeamPicker);
      addSection.appendChild(notesMatchSelect);

      notesTeamPicker = document.createElement('div');
      notesTeamPicker.className = 'note-team-picker';
      addSection.appendChild(notesTeamPicker);

      notesTextarea = document.createElement('textarea');
      notesTextarea.className = 'note-textarea';
      notesTextarea.placeholder = 'Note text…';
      addSection.appendChild(notesTextarea);

      notesAddBtn = document.createElement('button');
      notesAddBtn.className = 'btn-add-note';
      notesAddBtn.textContent = 'Add Note';
      notesAddBtn.addEventListener('click', submitAdminNote);
      addSection.appendChild(notesAddBtn);

      p.appendChild(addSection);

      var listSection = makeAdminSection('All Notes');

      notesSearchInput = document.createElement('input');
      notesSearchInput.className = 'note-search';
      notesSearchInput.placeholder = 'Search by team # or match #';
      notesSearchInput.addEventListener('input', renderNotesList);
      listSection.appendChild(notesSearchInput);

      notesListEl = document.createElement('div');
      notesListEl.className = 'notes-list';
      listSection.appendChild(notesListEl);

      p.appendChild(listSection);

      fetchNotes();
      connectNotesSocket();
    }

    // Called after gMatches refreshes (fetchMatches) so the match picker stays current.
    function renderNotesMatchSelect() {
      if (!notesMatchSelect) return;
      var prevValue = notesMatchSelect.value;
      while (notesMatchSelect.firstChild) notesMatchSelect.removeChild(notesMatchSelect.firstChild);
      gMatches.slice().sort(function (a, b) { return a.match_number - b.match_number; }).forEach(function (m) {
        var opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = (m.phase === 'playoffs' ? 'P' : 'Q') + m.match_number;
        notesMatchSelect.appendChild(opt);
      });
      if (prevValue && gMatches.some(function (m) { return String(m.id) === prevValue; })) {
        notesMatchSelect.value = prevValue;
      }
      renderNotesTeamPicker();
    }

    function currentNotesMatch() {
      var id = Number(notesMatchSelect.value);
      return gMatches.find(function (m) { return m.id === id; }) || null;
    }

    function renderNotesTeamPicker() {
      if (!notesTeamPicker) return;
      while (notesTeamPicker.firstChild) notesTeamPicker.removeChild(notesTeamPicker.firstChild);
      adminSelectedNoteTeam = null;

      var generalBtn = document.createElement('button');
      generalBtn.type = 'button';
      generalBtn.className = 'note-team-btn selected for-general';
      generalBtn.textContent = 'General';
      generalBtn.addEventListener('click', function () { selectAdminNoteTeam(null, generalBtn); });
      notesTeamPicker.appendChild(generalBtn);

      var match = currentNotesMatch();
      if (!match) return;

      function addTeamBtn(alliance, team) {
        if (!team) return;
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'note-team-btn for-' + alliance;
        btn.textContent = 'Team ' + team.number;
        btn.addEventListener('click', function () { selectAdminNoteTeam({ alliance: alliance, teamNumber: team.number }, btn); });
        notesTeamPicker.appendChild(btn);
      }
      addTeamBtn('red',  match.red1_team);
      addTeamBtn('red',  match.red2_team);
      addTeamBtn('blue', match.blue1_team);
      addTeamBtn('blue', match.blue2_team);
    }

    function selectAdminNoteTeam(team, btnEl) {
      adminSelectedNoteTeam = team;
      notesTeamPicker.querySelectorAll('.note-team-btn').forEach(function (b) {
        b.classList.toggle('selected', b === btnEl);
      });
    }

    function submitAdminNote() {
      var match = currentNotesMatch();
      if (!match) { showToast('No match selected', 'error'); return; }
      var text = (notesTextarea.value || '').trim();
      if (!text) { showToast('Note text is empty', 'error'); return; }

      fetch('/api/notes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          matchId:    match.id,
          alliance:   adminSelectedNoteTeam ? adminSelectedNoteTeam.alliance : null,
          teamNumber: adminSelectedNoteTeam ? adminSelectedNoteTeam.teamNumber : null,
          note:       text,
          author:     'admin',
        }),
      })
        .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
        .then(function () {
          notesTextarea.value = '';
          showToast('Note added', 'success');
        })
        .catch(function () { showToast('Failed to add note', 'error'); });
    }

    function fetchNotes() {
      fetch('/api/notes')
        .then(function (r) { return r.json(); })
        .then(function (notes) { gNotes = notes || []; renderNotesList(); })
        .catch(function () {});
    }

    function connectNotesSocket() {
      var sock = SK.connectSocket();
      if (!sock) return;
      sock.on('note_added', function (note) {
        if (!note) return;
        gNotes.unshift(note);
        renderNotesList();
      });
      sock.on('note_updated', function (note) {
        if (!note) return;
        var idx = gNotes.findIndex(function (n) { return n.id === note.id; });
        if (idx !== -1) gNotes[idx] = note;
        renderNotesList();
      });
      sock.on('note_removed', function (data) {
        if (!data) return;
        gNotes = gNotes.filter(function (n) { return n.id !== data.id; });
        renderNotesList();
      });
    }

    var notesViewMode      = 'list'; // 'list' (all matches) | 'detail' (one match's notes)
    var notesDetailMatchId = null;

    // Renders either the match list or a single match's note detail,
    // depending on notesViewMode.
    function renderNotesList() {
      if (!notesListEl) return;
      if (notesViewMode === 'detail') {
        renderNotesDetail();
      } else {
        renderNotesMatchList();
      }
    }

    function openNotesMatch(matchId) {
      notesViewMode = 'detail';
      notesDetailMatchId = matchId;
      renderNotesList();
    }

    function backToNotesMatchList() {
      notesViewMode = 'list';
      notesDetailMatchId = null;
      renderNotesList();
    }

    function renderNotesMatchList() {
      var query = (notesSearchInput.value || '').trim().toLowerCase();
      var matches = gMatches.slice().sort(function (a, b) { return a.match_number - b.match_number; });

      if (query) {
        matches = matches.filter(function (m) {
          if (String(m.match_number).indexOf(query) !== -1) return true;
          return gNotes.some(function (n) {
            return n.match_id === m.id && n.team_number != null && String(n.team_number).indexOf(query) !== -1;
          });
        });
      }

      while (notesListEl.firstChild) notesListEl.removeChild(notesListEl.firstChild);

      if (!matches.length) {
        var empty = document.createElement('div');
        empty.className = 'note-empty';
        empty.textContent = query ? 'No matches found.' : 'No matches yet.';
        notesListEl.appendChild(empty);
        return;
      }

      matches.forEach(function (m) {
        var count = gNotes.filter(function (n) { return n.match_id === m.id; }).length;

        var row = document.createElement('div');
        row.className = 'note-match-row';
        row.addEventListener('click', function () { openNotesMatch(m.id); });

        var label = document.createElement('span');
        label.className = 'note-match-row-label';
        label.textContent = (m.phase === 'playoffs' ? 'P' : 'Q') + m.match_number;
        row.appendChild(label);

        var countEl = document.createElement('span');
        countEl.className = 'note-match-row-count' + (count ? ' has-notes' : '');
        countEl.textContent = count ? (count === 1 ? '1 note' : count + ' notes') : 'No notes';
        row.appendChild(countEl);

        notesListEl.appendChild(row);
      });
    }

    function renderNotesDetail() {
      var match = gMatches.find(function (m) { return m.id === notesDetailMatchId; });

      while (notesListEl.firstChild) notesListEl.removeChild(notesListEl.firstChild);

      var backBtn = document.createElement('button');
      backBtn.type = 'button';
      backBtn.className = 'note-back-btn';
      backBtn.textContent = '← All matches';
      backBtn.addEventListener('click', backToNotesMatchList);
      notesListEl.appendChild(backBtn);

      var heading = document.createElement('div');
      heading.className = 'note-detail-heading';
      heading.textContent = match
        ? ((match.phase === 'playoffs' ? 'Playoff ' : 'Qualification ') + match.match_number)
        : ('Match #' + notesDetailMatchId);
      notesListEl.appendChild(heading);

      var matchNotes = gNotes.filter(function (n) { return n.match_id === notesDetailMatchId; });
      if (!matchNotes.length) {
        var empty = document.createElement('div');
        empty.className = 'note-empty';
        empty.textContent = 'No notes for this match yet.';
        notesListEl.appendChild(empty);
        return;
      }

      matchNotes.forEach(function (note) { notesListEl.appendChild(buildAdminNoteItem(note)); });
    }

    function buildAdminNoteItem(note) {
      var item = document.createElement('div');
      item.className = 'note-item';

      var header = document.createElement('div');
      header.className = 'note-item-header';

      var matchEl = document.createElement('span');
      matchEl.className = 'note-item-match';
      matchEl.textContent = note.match_number != null ? ('Match ' + note.match_number) : ('Match #' + note.match_id);
      header.appendChild(matchEl);

      var teamEl = document.createElement('span');
      if (note.team_number != null) {
        teamEl.className = 'note-item-team ' + (note.alliance || '');
        teamEl.textContent = (note.alliance || '').toUpperCase() + ' — Team ' + note.team_number;
      } else {
        teamEl.className = 'note-item-team general';
        teamEl.textContent = 'General';
      }
      header.appendChild(teamEl);

      var authorEl = document.createElement('span');
      authorEl.className = 'note-item-time';
      authorEl.textContent = (note.author || 'headref') + ' · ' + (note.created_at
        ? new Date(note.created_at * 1000).toLocaleString([], { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })
        : '');
      header.appendChild(authorEl);

      item.appendChild(header);

      var textEl = document.createElement('div');
      textEl.className = 'note-item-text';
      textEl.textContent = note.note;
      item.appendChild(textEl);

      var actions = document.createElement('div');
      actions.className = 'note-item-actions';

      var editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.textContent = 'Edit';
      editBtn.addEventListener('click', function () { startEditAdminNote(item, note); });
      actions.appendChild(editBtn);

      var delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'note-del';
      delBtn.textContent = 'Delete';
      delBtn.addEventListener('click', function () {
        if (!confirm('Delete this note?')) return;
        fetch('/api/notes/' + note.id, { method: 'DELETE' })
          .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
          .then(function () { showToast('Note deleted', 'info'); })
          .catch(function () { showToast('Failed to delete note', 'error'); });
      });
      actions.appendChild(delBtn);

      item.appendChild(actions);
      return item;
    }

    function startEditAdminNote(item, note) {
      while (item.firstChild) item.removeChild(item.firstChild);

      var textarea = document.createElement('textarea');
      textarea.className = 'note-item-edit-textarea';
      textarea.value = note.note;
      item.appendChild(textarea);

      var actions = document.createElement('div');
      actions.className = 'note-item-actions';

      var saveBtn = document.createElement('button');
      saveBtn.type = 'button';
      saveBtn.className = 'note-save';
      saveBtn.textContent = 'Save';
      saveBtn.addEventListener('click', function () {
        var newText = textarea.value.trim();
        if (!newText) { showToast('Note text is empty', 'error'); return; }
        fetch('/api/notes/' + note.id, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ note: newText }),
        })
          .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
          .then(function () { showToast('Note updated', 'success'); })
          .catch(function () { showToast('Failed to update note', 'error'); });
      });
      actions.appendChild(saveBtn);

      var cancelBtn = document.createElement('button');
      cancelBtn.type = 'button';
      cancelBtn.textContent = 'Cancel';
      cancelBtn.addEventListener('click', renderNotesList);
      actions.appendChild(cancelBtn);

      item.appendChild(actions);
    }

    // ════════════════════════════════════════════════════════════════════════════
    // RESET TAB
    // ════════════════════════════════════════════════════════════════════════════
    function buildAccessTab() {
      var p = panels.access;
      var section = makeAdminSection('Scan to Join');
      var help = document.createElement('p');
      help.style.color = 'var(--text2)';
      help.style.marginBottom = '0.75rem';
      help.textContent = 'Refs and organizers on the same network can scan this to open the site and pick their role (scorer, referee, head referee, etc).';
      section.appendChild(help);

      var qrBox = document.createElement('div');
      qrBox.style.cssText = 'display:flex; justify-content:center; padding:1rem; background:#fff; border-radius:8px; max-width:260px; margin-bottom:1rem;';
      section.appendChild(qrBox);

      var urlList = document.createElement('div');
      urlList.style.cssText = 'display:flex; flex-direction:column; gap:0.3rem; font-size:0.9rem; color:var(--text2);';
      section.appendChild(urlList);

      p.appendChild(section);

      fetch('/api/network-info')
        .then(function (r) { return r.json(); })
        .then(function (info) {
          var url = (info.urls && info.urls[0]) || (location.origin);
          if (typeof qrcode === 'function') {
            var qr = qrcode(0, 'M');
            qr.addData(url);
            qr.make();
            var img = document.createElement('img');
            img.src = qr.createDataURL(6, 4);
            img.alt = 'QR code: ' + url;
            img.style.cssText = 'max-width:100%; height:auto;';
            qrBox.appendChild(img);
          }
          var urls = (info.urls && info.urls.length) ? info.urls : [location.origin];
          urls.forEach(function (u) {
            var line = document.createElement('div');
            line.textContent = u;
            line.style.fontWeight = '700';
            line.style.color = 'var(--text)';
            urlList.appendChild(line);
          });
          if (!info.urls || !info.urls.length) {
            var note = document.createElement('div');
            note.textContent = 'No network interface detected — only accessible from this machine.';
            urlList.appendChild(note);
          }
        })
        .catch(function () {
          var err = document.createElement('div');
          err.textContent = 'Could not load network info.';
          err.style.color = 'var(--red-light)';
          urlList.appendChild(err);
        });
    }

    function buildResetTab() {
      var p = panels.reset;
      var section = makeAdminSection('Full Reset');
      section.className += ' danger-section';

      var warningEl = document.createElement('p');
      warningEl.style.color = 'var(--red-light)';
      warningEl.style.marginBottom = '0.75rem';
      warningEl.textContent = 'This will wipe ALL match data, scores, and rankings. Teams will be preserved. Type "RESET" to confirm.';
      section.appendChild(warningEl);

      var confirmInput = makeInput('text', '', '');
      confirmInput.placeholder = 'Type RESET to confirm';
      confirmInput.style.width = '220px';
      confirmInput.style.marginBottom = '0.5rem';
      section.appendChild(confirmInput);

      var resetBtn = document.createElement('button');
      resetBtn.className = 'danger-btn';
      resetBtn.textContent = 'Full Reset';
      resetBtn.addEventListener('click', function () {
        if (confirmInput.value !== 'RESET') {
          showToast('Type exactly "RESET" to confirm', 'error');
          return;
        }
        fetch('/api/admin/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ confirm: 'RESET' }),
        })
          .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
          .then(function () {
            showToast('System reset complete', 'success');
            confirmInput.value = '';
            fetchAllData();
          })
          .catch(function () { showToast('Reset failed', 'error'); });
      });
      section.appendChild(resetBtn);
      p.appendChild(section);
    }

    // ── Utility ────────────────────────────────────────────────────────────────
    function makeAdminSection(title) {
      var section = document.createElement('div');
      section.className = 'admin-section';
      var h2 = document.createElement('h2');
      h2.textContent = title;
      section.appendChild(h2);
      return section;
    }

    function makeInput(type, placeholder, defaultVal) {
      var inp = document.createElement('input');
      inp.type = type;
      inp.placeholder = placeholder;
      if (defaultVal !== undefined) inp.value = defaultVal;
      return inp;
    }

  })();
  </script>
</body>
</html>
