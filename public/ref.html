<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red Field Referee — Score Keeper</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    :root {
      --red-bg: #1a0000;
    }

    body {
      background: var(--red-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .ref-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #2a0000;
      border-bottom: 3px solid var(--red);
      padding: 0.6rem 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 0.75rem;
    }

    .ref-header .ref-title {
      font-size: 1.1rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--red-light);
      white-space: nowrap;
    }

    .ref-header .timer-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.1rem;
      flex: 1;
      justify-content: center;
    }

    .ref-header .period-label {
      font-size: 0.75rem;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .ref-header .timer-display {
      font-size: 3.2rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1;
    }

    .header-scores {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-variant-numeric: tabular-nums;
      font-weight: 900;
      font-size: 3rem;
      margin-top: 0.15rem;
    }
    .header-scores .hs-red  { color: var(--red-light); }
    .header-scores .hs-blue { color: var(--blue-light); }
    .header-scores .hs-sep  { color: var(--text2); font-weight: 400; font-size: 2rem; }

    .ref-header .header-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 80px;
      justify-content: flex-end;
    }

    /* ── Main body ── */
    .ref-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1rem;
      gap: 1rem;
    }

    /* ── Penalty buttons ── */
    .penalty-buttons {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      flex: 1;
    }

    .penalty-btn-large {
      flex: 1;
      min-height: 100px;
      border: none;
      border-radius: 12px;
      font-size: 1.6rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: filter 0.1s, transform 0.1s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      padding: 1rem;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .penalty-btn-large:active {
      filter: brightness(0.85);
      transform: scale(0.97);
    }

    .penalty-btn-large .btn-sub {
      font-size: 0.8rem;
      font-weight: 400;
      opacity: 0.8;
      letter-spacing: 0.05em;
    }

    .btn-minor {
      background: #b8860b;
      color: #fff;
      border: 2px solid #e6a800;
    }

    .btn-major {
      background: #8b0000;
      color: #fff;
      border: 2px solid var(--red-light);
    }

    .penalty-btn-large:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Penalty log ── */
    .log-section {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .log-section-header {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text2);
      padding: 0.4rem 0.75rem;
      background: var(--bg3);
      border-bottom: 1px solid var(--border);
    }

    .log-scroll {
      max-height: 160px;
      overflow-y: auto;
    }

    .log-entry {
      display: grid;
      grid-template-columns: auto auto 1fr;
      gap: 0.5rem;
      align-items: center;
      padding: 0.4rem 0.75rem;
      border-bottom: 1px solid var(--bg3);
      font-size: 0.82rem;
    }

    .log-entry:last-child {
      border-bottom: none;
    }

    .log-time {
      color: var(--text2);
      font-variant-numeric: tabular-nums;
      font-size: 0.75rem;
    }

    .log-type {
      font-weight: 700;
    }

    .log-type.minor { color: #e6a800; }
    .log-type.major { color: var(--red-light); }

    .log-team {
      color: var(--text2);
      text-align: right;
    }

    .log-empty {
      padding: 0.6rem 0.75rem;
      color: var(--text2);
      font-size: 0.82rem;
      text-align: center;
    }


    /* ── Abort overlay ── */
    .abort-banner {
      display: none;
      background: #330000;
      border: 2px solid var(--red);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      text-align: center;
      color: var(--red-light);
      font-weight: 700;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .abort-banner.visible {
      display: block;
    }
  </style>
</head>
<body>

  <header class="ref-header" id="page-header">
    <span class="ref-title">Red Referee</span>
    <div class="timer-center">
      <div class="period-label" id="period-label">Waiting</div>
      <div class="timer-display" id="timer-el">0:00</div>
      <div class="header-scores">
        <span class="hs-red" id="red-score">0</span>
        <span class="hs-sep">—</span>
        <span class="hs-blue" id="blue-score">0</span>
      </div>
    </div>
    <div class="header-right" id="header-right"></div>
  </header>

  <div class="ref-body" id="ref-body">

    <div class="abort-banner" id="abort-banner">Match aborted — waiting for next match</div>

    <div class="penalty-buttons" id="penalty-buttons">
      <button class="penalty-btn-large btn-minor" id="btn-minor" disabled>
        Minor Foul
        <span class="btn-sub">+5 pts to Blue</span>
      </button>
      <button class="penalty-btn-large btn-major" id="btn-major" disabled>
        Major Foul
        <span class="btn-sub">+15 pts to Blue</span>
      </button>
    </div>

    <div class="log-section">
      <div class="log-section-header">Penalty Log</div>
      <div class="log-scroll">
        <div id="log-body">
          <div class="log-empty" id="log-empty">No penalties yet</div>
        </div>
      </div>
    </div>

  </div>


  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script>
  (function () {
    'use strict';

    var state = {
      matchId: null,
      aborted: false,
    };

    var matchRunning = false;

    // DOM refs
    var timerEl      = document.getElementById('timer-el');
    var periodLbl    = document.getElementById('period-label');
    var redScoreEl   = document.getElementById('red-score');
    var blueScoreEl  = document.getElementById('blue-score');
    var btnMinor     = document.getElementById('btn-minor');
    var btnMajor     = document.getElementById('btn-major');
    var logBody      = document.getElementById('log-body');
    var logEmpty     = document.getElementById('log-empty');
    var abortBanner  = document.getElementById('abort-banner');

    // ── Auth gate ──────────────────────────────────────────────────────────────
    SK.mountPinPad('ref', 'Red Field Referee').then(function () {
      SK.addLogoutButton(document.getElementById('header-right'));
      init();
    });

    // ── Init ───────────────────────────────────────────────────────────────────
    function init() {
      fetchTimerState();
      connectSocketEvents();

      btnMinor.addEventListener('click', function () { emitPenalty('minor'); });
      btnMajor.addEventListener('click', function () { emitPenalty('major'); });
    }

    // ── Enable / disable buttons ───────────────────────────────────────────────
    function setButtonsEnabled(enabled) {
      btnMinor.disabled = !enabled;
      btnMajor.disabled = !enabled;
    }

    // ── Penalty emission ───────────────────────────────────────────────────────
    var socket;
    function getSocket() {
      if (!socket) socket = SK.connectSocket();
      return socket;
    }

    function emitPenalty(type) {
      if (!matchRunning)  { window.showToast('Match is not active', 'error'); return; }
      if (!state.matchId) { window.showToast('No match loaded', 'error'); return; }
      if (state.aborted)  { window.showToast('Match aborted', 'error'); return; }
      getSocket().emit('penalty', {
        matchId: state.matchId,
        alliance: 'red',
        teamNumber: null,
        type: type,
      });
    }

    // ── Fetch timer state ──────────────────────────────────────────────────────
    function fetchTimerState() {
      fetch('/api/timer')
        .then(function (r) { return r.json(); })
        .then(function (ts) {
          SK.applyTimerState(ts, timerEl, periodLbl);
          if (ts.matchId) {
            state.matchId = ts.matchId;
            state.aborted = false;
            // Buttons stay disabled until match_start; running state is
            // driven exclusively by socket events.
            fetchPenalties(ts.matchId);
          }
        })
        .catch(function () {});
    }

    // ── Fetch existing penalties ───────────────────────────────────────────────
    function fetchPenalties(matchId) {
      fetch('/api/matches/' + matchId + '/penalties')
        .then(function (r) { return r.json(); })
        .then(function (penalties) {
          if (!Array.isArray(penalties)) return;
          // Show only red alliance penalties in this view
          var redPenalties = penalties.filter(function (p) { return p.alliance === 'red'; });
          redPenalties.forEach(function (p) {
            addLogEntry({
              time: formatMatchTime(p.match_time),
              type: p.type,
              teamNumber: p.team_number,
            });
          });
        })
        .catch(function () {});
    }

    // ── Penalty log ────────────────────────────────────────────────────────────
    function clearLog() {
      while (logBody.firstChild) logBody.removeChild(logBody.firstChild);
      logEmpty = document.createElement('div');
      logEmpty.className = 'log-empty';
      logEmpty.id = 'log-empty';
      logEmpty.textContent = 'No penalties yet';
      logBody.appendChild(logEmpty);
    }

    function addLogEntry(entry) {
      // Remove empty placeholder if present
      var emptyEl = logBody.querySelector('.log-empty');
      if (emptyEl) logBody.removeChild(emptyEl);

      var row = document.createElement('div');
      row.className = 'log-entry';

      var timeEl = document.createElement('span');
      timeEl.className = 'log-time';
      timeEl.textContent = entry.time || '--:--';

      var typeEl = document.createElement('span');
      typeEl.className = 'log-type ' + (entry.type || '');
      typeEl.textContent = (entry.type || 'foul').toUpperCase();

      var teamEl = document.createElement('span');
      teamEl.className = 'log-team';
      teamEl.textContent = entry.teamNumber ? 'Team ' + entry.teamNumber : '';

      row.appendChild(timeEl);
      row.appendChild(typeEl);
      row.appendChild(teamEl);

      // Newest first
      logBody.insertBefore(row, logBody.firstChild);
    }

    function formatMatchTime(seconds) {
      if (seconds == null) return '--:--';
      var m = Math.floor(Math.abs(seconds) / 60);
      var s = Math.floor(Math.abs(seconds) % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    // ── Socket events ──────────────────────────────────────────────────────────
    function connectSocketEvents() {
      var sock = getSocket();
      if (!sock) return;

      sock.on('timer_tick', function (ts) {
        SK.applyTimerState(ts, timerEl, periodLbl);
      });

      sock.on('period_change', function (ts) {
        SK.applyTimerState(ts, timerEl, periodLbl);
        SK.playBuzzer();
      });

      sock.on('match_start', function () {
        matchRunning = true;
        state.aborted = false;
        abortBanner.classList.remove('visible');
        setButtonsEnabled(true);
      });

      sock.on('match_end', function () {
        matchRunning = false;
        setButtonsEnabled(false);
      });

      sock.on('match_abort', function () {
        matchRunning = false;
        state.aborted = true;
        abortBanner.classList.add('visible');
        setButtonsEnabled(false);
      });

      sock.on('match_loaded', function (data) {
        if (data && data.matchId) {
          matchRunning = false;
          state.matchId = data.matchId;
          state.aborted = false;
          abortBanner.classList.remove('visible');
          setButtonsEnabled(false);
          clearLog();
        }
      });

      sock.on('score_update', function (data) {
        if (data && data.red  && data.red.total  != null) redScoreEl.textContent  = data.red.total;
        if (data && data.blue && data.blue.total != null) blueScoreEl.textContent = data.blue.total;
      });

      sock.on('penalty_added', function (data) {
        // data shape: { matchId, penalty, all }
        var p = data && (data.penalty || data);
        if (!p) return;
        // Only show red alliance penalties in this log
        if (p.alliance !== 'red') return;
        addLogEntry({
          time: formatMatchTime(p.match_time),
          type: p.type,
          teamNumber: p.team_number,
        });
        window.showToast('RED ' + (p.type || 'foul').toUpperCase() + ' called', 'error');
      });
    }

  })();
  </script>
</body>
</html>
