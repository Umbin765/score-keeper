<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue Referee — Score Keeper</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* Full-screen layout — no scrolling */
    body {
      background: var(--blue-bg);
      display: flex; flex-direction: column;
      height: 100vh; height: 100dvh;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    .ref-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.65rem 1rem; background: #000814;
      border-bottom: 2px solid var(--blue); flex-shrink: 0;
    }
    .ref-title {
      font-size: 1.1rem; font-weight: 900;
      color: var(--blue-light); letter-spacing: 0.1em;
    }
    .timer-info { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 0.05rem; }
    .period-compact {
      font-size: 0.75rem; color: var(--text2);
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .timer-compact {
      font-size: 3.2rem; font-weight: 900; line-height: 1;
      color: var(--timer-normal); font-variant-numeric: tabular-nums;
    }
    .header-scores {
      display: flex; align-items: center; gap: 0.6rem;
      font-variant-numeric: tabular-nums; font-weight: 900; font-size: 3rem;
    }
    .hs-red  { color: var(--red-light); }
    .hs-blue { color: var(--blue-light); }
    .hs-sep  { color: var(--text2); font-weight: 400; font-size: 2rem; }
    /* spacer keeps timer centred when logout button is absent */
    .header-right { min-width: 90px; display: flex; justify-content: flex-end; }

    /* ── Penalty buttons ─────────────────────────────────────────────────── */
    .penalty-area {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column; gap: 0.75rem;
      padding: 0.75rem;
    }
    .penalty-btn-big {
      flex: 1; min-height: 80px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 0.3rem;
      border-radius: 14px; border: 3px solid transparent;
      font-weight: 900; letter-spacing: 0.06em;
      text-transform: uppercase; touch-action: manipulation;
      cursor: pointer; transition: filter 0.1s, transform 0.06s;
    }
    .penalty-btn-big:active { transform: scale(0.97); filter: brightness(0.85); }
    .penalty-btn-big:disabled {
      opacity: 0.35; cursor: not-allowed; transform: none; filter: none;
    }
    .penalty-btn-big .btn-label {
      font-size: clamp(1.4rem, 5vw, 2.2rem); line-height: 1;
    }
    .penalty-btn-big .btn-sub {
      font-size: clamp(0.8rem, 2.5vw, 1rem); opacity: 0.75; font-weight: 600;
    }

    /* Minor = yellow */
    .btn-minor {
      background: #2a2000; border-color: var(--yellow); color: var(--yellow);
    }
    .btn-minor:hover:not(:disabled) { background: #3d2e00; }

    /* Major = red */
    .btn-major {
      background: #220000; border-color: var(--red-light); color: var(--red-light);
    }
    .btn-major:hover:not(:disabled) { background: #330000; }

    /* ── Penalty log ─────────────────────────────────────────────────────── */
    .log-section {
      flex-shrink: 0; max-height: 28vh;
      display: flex; flex-direction: column;
      background: #000f2a; border-top: 1px solid var(--blue-border);
    }
    .log-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.4rem 0.75rem; flex-shrink: 0;
    }
    .log-title {
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--blue-light);
    }
    .log-count {
      font-size: 0.75rem; color: var(--text2);
    }
    .log-scroll {
      flex: 1; overflow-y: auto; padding: 0 0.75rem 0.5rem;
    }
    .log-entry {
      display: grid; grid-template-columns: 3.5rem 3.5rem 1fr;
      gap: 0.5rem; align-items: center;
      padding: 0.3rem 0; border-bottom: 1px solid var(--bg3);
      font-size: 0.82rem;
    }
    .log-entry:last-child { border-bottom: none; }
    .log-time { color: var(--text2); font-variant-numeric: tabular-nums; }
    .log-type-minor { color: var(--yellow); font-weight: 700; }
    .log-type-major { color: var(--red-light); font-weight: 700; }
    .log-team { color: var(--text2); }
    .empty-log {
      color: var(--text2); font-size: 0.82rem;
      text-align: center; padding: 0.6rem 0;
    }


    /* ── Disabled overlay ────────────────────────────────────────────────── */
    .wait-overlay {
      position: fixed; inset: 0; background: rgba(0,0,8,0.88);
      z-index: 200; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 0.75rem;
    }
    .wait-overlay.hidden { display: none; }
    .wait-text {
      font-size: clamp(1.6rem, 6vw, 2.4rem); font-weight: 900;
      color: var(--blue-light); text-transform: uppercase; letter-spacing: 0.12em;
      text-align: center;
    }
    .wait-sub {
      font-size: 0.95rem; color: var(--text2);
    }
  </style>
</head>
<body>

  <header class="ref-header" id="ref-header">
    <span class="ref-title">BLUE REFEREE</span>
    <div class="timer-info">
      <div class="period-compact" id="period-label">Waiting</div>
      <div class="timer-compact" id="timer-el">0:00</div>
      <div class="header-scores">
        <span class="hs-red" id="red-score">0</span>
        <span class="hs-sep">—</span>
        <span class="hs-blue" id="blue-score">0</span>
      </div>
    </div>
    <div class="header-right" id="header-right"></div>
  </header>

  <div class="penalty-area" id="penalty-area">
    <button class="penalty-btn-big btn-minor" id="btn-minor" type="button">
      <span class="btn-label">MINOR FOUL</span>
      <span class="btn-sub">+5 pts to RED</span>
    </button>
    <button class="penalty-btn-big btn-major" id="btn-major" type="button">
      <span class="btn-label">MAJOR FOUL</span>
      <span class="btn-sub">+12 pts to RED</span>
    </button>
  </div>

  <div class="log-section">
    <div class="log-header">
      <span class="log-title">Penalty Log</span>
      <span class="log-count" id="log-count">0 penalties</span>
    </div>
    <div class="log-scroll" id="log-scroll">
      <div class="empty-log" id="empty-log">No penalties this match</div>
    </div>
  </div>


  <div class="wait-overlay" id="wait-overlay">
    <div class="wait-text" id="wait-text">No Match Loaded</div>
    <div class="wait-sub" id="wait-sub">Waiting for match to be loaded…</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script>
  (function () {
    'use strict';

    var ALLIANCE = 'blue';

    var state = {
      matchId: null,
      penaltyCount: 0,
      disabled: true,
      matchRunning: false,
    };

    // ── Auth gate ──────────────────────────────────────────────────────────────
    SK.mountPinPad('ref', 'Blue Field Referee').then(function () {
      SK.addLogoutButton(document.getElementById('header-right'));
      init();
    });

    // ── Element refs ───────────────────────────────────────────────────────────
    var timerEl    = document.getElementById('timer-el');
    var periodLbl  = document.getElementById('period-label');
    var btnMinor   = document.getElementById('btn-minor');
    var btnMajor   = document.getElementById('btn-major');
    var logScroll  = document.getElementById('log-scroll');
    var logCount   = document.getElementById('log-count');
    var redScoreEl = document.getElementById('red-score');
    var blueScoreEl= document.getElementById('blue-score');
    var waitOverlay= document.getElementById('wait-overlay');
    var waitText   = document.getElementById('wait-text');
    var waitSub    = document.getElementById('wait-sub');

    // Buttons start disabled on page load — enabled only when match is running
    btnMinor.setAttribute('disabled', '');
    btnMinor.style.opacity = '0.5';
    btnMinor.style.cursor  = 'not-allowed';
    btnMajor.setAttribute('disabled', '');
    btnMajor.style.opacity = '0.5';
    btnMajor.style.cursor  = 'not-allowed';

    // ── Socket ─────────────────────────────────────────────────────────────────
    var socket;
    function getSocket() {
      if (!socket) socket = SK.connectSocket();
      return socket;
    }

    // ── Init ───────────────────────────────────────────────────────────────────
    function init() {
      btnMinor.addEventListener('click', function () { emitPenalty('minor'); });
      btnMajor.addEventListener('click', function () { emitPenalty('major'); });

      fetchTimerState();
      connectSocketEvents();
    }

    // ── Disable / enable penalty buttons ──────────────────────────────────────
    function setButtonsEnabled(enabled) {
      state.disabled = !enabled;
      [btnMinor, btnMajor].forEach(function (btn) {
        if (enabled) {
          btn.removeAttribute('disabled');
          btn.style.opacity = '';
          btn.style.cursor  = '';
        } else {
          btn.setAttribute('disabled', '');
          btn.style.opacity = '0.5';
          btn.style.cursor  = 'not-allowed';
        }
      });
    }

    // kept for internal use by showWait/hideWait — delegates to setButtonsEnabled
    function setPenaltiesEnabled(enabled) {
      setButtonsEnabled(enabled);
    }

    function showWait(msg, sub) {
      waitText.textContent = msg || 'No Match';
      waitSub.textContent  = sub || '';
      waitOverlay.classList.remove('hidden');
      setButtonsEnabled(false);
    }

    function hideWait() {
      waitOverlay.classList.add('hidden');
      // Only enable buttons when the match is actively running
      setButtonsEnabled(state.matchRunning);
    }

    // ── Penalty emission ───────────────────────────────────────────────────────
    function emitPenalty(type) {
      if (!state.matchRunning) { showToast('Match is not active', 'error'); return; }
      if (!state.matchId) { showToast('No match loaded', 'error'); return; }
      getSocket().emit('penalty', {
        matchId:    state.matchId,
        alliance:   ALLIANCE,
        teamNumber: null,
        type:       type,
      });
    }

    // ── Fetch initial state ────────────────────────────────────────────────────
    function fetchTimerState() {
      fetch('/api/timer')
        .then(function (r) { return r.json(); })
        .then(function (ts) {
          SK.applyTimerState(ts, timerEl, periodLbl);
          if (ts.matchId) {
            state.matchId = ts.matchId;
            fetchExistingPenalties(ts.matchId);
            // Only mark running if the timer is actively counting
            state.matchRunning = !!(ts.running);
            hideWait(); // removes overlay; setButtonsEnabled inside uses matchRunning
          } else {
            showWait('No Match Loaded', 'Waiting for match to be loaded\u2026');
          }
        })
        .catch(function () {
          showWait('Connection Error', 'Unable to reach server');
        });
    }

    function fetchExistingPenalties(matchId) {
      fetch('/api/matches/' + matchId + '/penalties')
        .then(function (r) { return r.json(); })
        .then(function (penalties) {
          if (!Array.isArray(penalties)) return;
          // Show only blue alliance penalties in this ref's log
          penalties
            .filter(function (p) { return p.alliance === ALLIANCE; })
            .forEach(function (p) { appendLogEntry(p, true); });
        })
        .catch(function () {});
    }

    // ── Penalty log ────────────────────────────────────────────────────────────
    function clearLog() {
      state.penaltyCount = 0;
      while (logScroll.firstChild) logScroll.removeChild(logScroll.firstChild);
      var empty = document.createElement('div');
      empty.className = 'empty-log';
      empty.id = 'empty-log';
      empty.textContent = 'No penalties this match';
      logScroll.appendChild(empty);
      logCount.textContent = '0 penalties';
    }

    // append = true means append to bottom (bulk load), false = prepend (live)
    function appendLogEntry(entry, append) {
      var emptyEl = logScroll.querySelector('.empty-log');
      if (emptyEl) logScroll.removeChild(emptyEl);

      state.penaltyCount++;
      var plural = state.penaltyCount === 1 ? '1 penalty' : state.penaltyCount + ' penalties';
      logCount.textContent = plural;

      var row = document.createElement('div');
      row.className = 'log-entry';

      var timeEl = document.createElement('span');
      timeEl.className = 'log-time';
      timeEl.textContent = entry.time || '--:--';

      var typeEl = document.createElement('span');
      var typeCls = entry.type === 'major' ? 'log-type-major' : 'log-type-minor';
      typeEl.className = typeCls;
      typeEl.textContent = (entry.type || 'foul').toUpperCase();

      var teamEl = document.createElement('span');
      teamEl.className = 'log-team';
      teamEl.textContent = entry.teamNumber ? '#' + entry.teamNumber : 'Any';

      row.appendChild(timeEl);
      row.appendChild(typeEl);
      row.appendChild(teamEl);

      if (append) {
        logScroll.appendChild(row);
      } else {
        logScroll.insertBefore(row, logScroll.firstChild);
        // Scroll to top so newest is visible
        logScroll.scrollTop = 0;
      }
    }

    // ── Socket events ──────────────────────────────────────────────────────────
    function connectSocketEvents() {
      var sock = getSocket();
      if (!sock) return;

      sock.on('timer_tick', function (ts) {
        SK.applyTimerState(ts, timerEl, periodLbl);
      });

      sock.on('period_change', function (ts) {
        SK.applyTimerState(ts, timerEl, periodLbl);
        SK.playBuzzer();
      });

      sock.on('match_start', function (ts) {
        SK.applyTimerState(ts, timerEl, periodLbl);
        state.matchRunning = true;
        setButtonsEnabled(true);
        hideWait();
      });

      sock.on('match_end', function () {
        state.matchRunning = false;
        setButtonsEnabled(false);
        periodLbl.textContent = 'Final';
      });

      sock.on('match_loaded', function (data) {
        // Reset log and teams for the new match
        state.matchRunning = false;
        setButtonsEnabled(false);
        clearLog();
        if (data && data.matchId) {
          state.matchId = data.matchId;
        }
        hideWait();
      });

      sock.on('match_abort', function () {
        state.matchId = null;
        state.matchRunning = false;
        setButtonsEnabled(false);
        clearLog();
        showWait('Match Aborted', 'Waiting for next match\u2026');
      });

      sock.on('score_update', function (data) {
        if (data && data.red  && data.red.total  != null) redScoreEl.textContent  = data.red.total;
        if (data && data.blue && data.blue.total != null) blueScoreEl.textContent = data.blue.total;
      });

      sock.on('penalty_added', function (entry) {
        // Show all penalties in the log so referee can see the full picture,
        // but only log blue-alliance penalties (fouls called against blue)
        if (entry && entry.alliance === ALLIANCE) {
          appendLogEntry(entry, false);
          var typeLabel = entry.type === 'major' ? 'MAJOR' : 'MINOR';
          var teamLabel = entry.teamNumber ? ' — Team ' + entry.teamNumber : '';
          showToast(typeLabel + ' foul recorded' + teamLabel, 'success');
        }
      });
    }

  })();
  </script>
</body>
</html>
