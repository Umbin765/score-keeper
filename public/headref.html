<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Head Referee — Score Keeper</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .ref-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      padding: 1rem;
    }
    .full-width { grid-column: 1 / -1; }
    .alliance-col { display: flex; flex-direction: column; gap: 0.75rem; }
    .alliance-col.red-col  { border-left: 3px solid var(--red);  padding-left: 0.75rem; }
    .alliance-col.blue-col { border-left: 3px solid var(--blue); padding-left: 0.75rem; }
    .col-title { font-size: 1rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.25rem; }
    .col-title.red-text  { color: var(--red-light); }
    .col-title.blue-text { color: var(--blue-light); }
    .team-select { width: 100%; margin-bottom: 0.5rem; }
    .penalty-btn { margin-bottom: 0.5rem; }
    .score-bar {
      display: flex; align-items: center; justify-content: center; gap: 1.5rem;
      background: var(--bg2); border-top: 1px solid var(--border);
      padding: 0.5rem 1rem; position: sticky; bottom: 0;
    }
    .score-bar .score-item { text-align: center; }
    .score-bar .score-num { font-size: 2rem; font-weight: 900; font-variant-numeric: tabular-nums; }
    .score-bar .score-lbl { font-size: 0.75rem; color: var(--text2); text-transform: uppercase; }
    .penalty-log-entry { display: grid; grid-template-columns: auto auto 1fr auto; gap: 0.5rem; align-items: center; padding: 0.35rem 0.5rem; border-bottom: 1px solid var(--bg3); font-size: 0.85rem; }
    .penalty-log-entry:last-child { border-bottom: none; }
    .log-time { color: var(--text2); font-variant-numeric: tabular-nums; }
    .log-type { font-weight: 700; }
    .log-type.minor  { color: var(--yellow); }
    .log-type.major  { color: var(--red-light); }
    .log-type.yellow { color: var(--yellow); }
    .log-type.red    { color: var(--red-light); }
    .log-team { color: var(--text2); }
    .log-alliance.red  { color: var(--red-light); }
    .log-alliance.blue { color: var(--blue-light); }
    .log-table-wrap { max-height: 200px; overflow-y: auto; }
    .empty-log { color: var(--text2); font-size: 0.85rem; padding: 0.5rem; text-align: center; }
    .override-row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.5rem; }
    .override-row label { font-size: 0.9rem; color: var(--text2); min-width: 80px; }
    .override-row select, .override-row input { flex: 1; min-width: 80px; }
    .audit-table-wrap { max-height: 300px; overflow-y: auto; margin-top: 0.75rem; }
  </style>
</head>
<body>

  <header class="page-header" id="page-header">
    <span class="page-title">Head Referee</span>
    <div style="display:flex;align-items:center;gap:0.75rem;">
      <div class="period-label" id="period-label" style="font-size:0.9rem;margin:0">Waiting</div>
      <div class="timer-display" id="timer-el" style="font-size:1.8rem">0:00</div>
    </div>
  </header>

  <div class="ref-layout" id="ref-layout"></div>

  <div class="score-bar" id="score-bar">
    <div class="score-item">
      <div class="score-num red-text" id="red-score">0</div>
      <div class="score-lbl">RED</div>
    </div>
    <div class="vs-divider">VS</div>
    <div class="score-item">
      <div class="score-num blue-text" id="blue-score">0</div>
      <div class="score-lbl">BLUE</div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script>
  (function () {
    'use strict';

    var state = {
      matchId: null,
      redTeams: [],
      blueTeams: [],
    };

    SK.mountPinPad('headref', 'Head Referee').then(function () {
      SK.addLogoutButton(document.getElementById('page-header'));
      init();
    });

    var timerEl     = document.getElementById('timer-el');
    var periodLbl   = document.getElementById('period-label');
    var redScoreEl  = document.getElementById('red-score');
    var blueScoreEl = document.getElementById('blue-score');
    var layout      = document.getElementById('ref-layout');

    var redTeamSel, blueTeamSel;
    var logBody, auditBody;

    // Score override field options
    var OVERRIDE_FIELDS = [
      'auto_classified','auto_overflow','auto_leave','auto_pattern',
      'teleop_classified','teleop_overflow','teleop_balls',
      'park','penalties',
    ];

    function init() {
      buildLayout();
      fetchTimerState();
      connectSocketEvents();
    }

    // ── Build layout ───────────────────────────────────────────────────────────
    function buildLayout() {
      // ── Red column ──
      var redCol = document.createElement('div');
      redCol.className = 'alliance-col red-col';

      var redTitle = document.createElement('div');
      redTitle.className = 'col-title red-text';
      redTitle.textContent = 'RED Penalties';
      redCol.appendChild(redTitle);

      redTeamSel = document.createElement('select');
      redTeamSel.className = 'team-select';
      appendPlaceholder(redTeamSel, 'Select Team');
      redCol.appendChild(redTeamSel);

      redCol.appendChild(makePenaltyBtn('Minor Foul',  'minor',  'red'));
      redCol.appendChild(makePenaltyBtn('Major Foul',  'major',  'red'));
      redCol.appendChild(makePenaltyBtn('Yellow Card', 'yellow', 'red'));
      redCol.appendChild(makePenaltyBtn('Red Card',    'red',    'red'));

      // ── Blue column ──
      var blueCol = document.createElement('div');
      blueCol.className = 'alliance-col blue-col';

      var blueTitle = document.createElement('div');
      blueTitle.className = 'col-title blue-text';
      blueTitle.textContent = 'BLUE Penalties';
      blueCol.appendChild(blueTitle);

      blueTeamSel = document.createElement('select');
      blueTeamSel.className = 'team-select';
      appendPlaceholder(blueTeamSel, 'Select Team');
      blueCol.appendChild(blueTeamSel);

      blueCol.appendChild(makePenaltyBtn('Minor Foul',  'minor',  'blue'));
      blueCol.appendChild(makePenaltyBtn('Major Foul',  'major',  'blue'));
      blueCol.appendChild(makePenaltyBtn('Yellow Card', 'yellow', 'blue'));
      blueCol.appendChild(makePenaltyBtn('Red Card',    'red',    'blue'));

      // ── Penalty log ──
      var logSection = document.createElement('div');
      logSection.className = 'card full-width';

      var logTitle = document.createElement('h3');
      logTitle.textContent = 'Penalty Log';
      logSection.appendChild(logTitle);

      var logWrap = document.createElement('div');
      logWrap.className = 'log-table-wrap';
      logBody = document.createElement('div');
      renderEmptyLog();
      logWrap.appendChild(logBody);
      logSection.appendChild(logWrap);

      // ── Score Override (head ref only) ──
      var overrideSection = document.createElement('div');
      overrideSection.className = 'card full-width mt-2';

      var overrideTitle = document.createElement('h2');
      overrideTitle.textContent = 'Score Override';
      overrideSection.appendChild(overrideTitle);

      var overAllianceSel = document.createElement('select');
      overAllianceSel.style.marginRight = '0.5rem';
      appendOption(overAllianceSel, 'red', 'RED');
      appendOption(overAllianceSel, 'blue', 'BLUE');

      var overFieldSel = document.createElement('select');
      OVERRIDE_FIELDS.forEach(function (f) { appendOption(overFieldSel, f, f); });

      var overValueInput = document.createElement('input');
      overValueInput.type = 'number';
      overValueInput.min = '0';
      overValueInput.placeholder = 'Value';
      overValueInput.style.width = '80px';

      var overBtn = document.createElement('button');
      overBtn.className = 'control-btn';
      overBtn.textContent = 'Apply Override';
      overBtn.addEventListener('click', function () {
        applyOverride(overAllianceSel.value, overFieldSel.value, parseInt(overValueInput.value, 10));
      });

      var overRow = document.createElement('div');
      overRow.className = 'override-row';
      var ovLabel = document.createElement('label');
      ovLabel.textContent = 'Alliance:';
      overRow.appendChild(ovLabel);
      overRow.appendChild(overAllianceSel);
      var fLabel = document.createElement('label');
      fLabel.textContent = 'Field:';
      overRow.appendChild(fLabel);
      overRow.appendChild(overFieldSel);
      var vLabel = document.createElement('label');
      vLabel.textContent = 'Value:';
      overRow.appendChild(vLabel);
      overRow.appendChild(overValueInput);
      overRow.appendChild(overBtn);
      overrideSection.appendChild(overRow);

      // ── Post-match actions ──
      var actionsSection = document.createElement('div');
      actionsSection.className = 'card full-width mt-2';

      var actTitle = document.createElement('h2');
      actTitle.textContent = 'Post-Match Actions';
      actionsSection.appendChild(actTitle);

      var actRow = document.createElement('div');
      actRow.className = 'btn-row';

      var commitBtn = document.createElement('button');
      commitBtn.className = 'control-btn commit';
      commitBtn.textContent = 'Commit Scores';
      commitBtn.addEventListener('click', commitScores);

      var replayBtn = document.createElement('button');
      replayBtn.className = 'control-btn';
      replayBtn.textContent = 'Replay Match';
      replayBtn.addEventListener('click', replayMatch);

      var auditBtn = document.createElement('button');
      auditBtn.className = 'control-btn';
      auditBtn.textContent = 'Refresh Audit Log';
      auditBtn.addEventListener('click', fetchAuditLog);

      actRow.appendChild(commitBtn);
      actRow.appendChild(replayBtn);
      actRow.appendChild(auditBtn);
      actionsSection.appendChild(actRow);

      // ── Audit log ──
      var auditSection = document.createElement('div');
      auditSection.className = 'card full-width mt-2';

      var auditTitle = document.createElement('h2');
      auditTitle.textContent = 'Audit Log';
      auditSection.appendChild(auditTitle);

      var auditWrap = document.createElement('div');
      auditWrap.className = 'audit-table-wrap';
      auditBody = document.createElement('table');
      auditBody.className = 'data-table';

      var thead = document.createElement('thead');
      var htr = document.createElement('tr');
      ['Time','User','Action','Details'].forEach(function (h) {
        var th = document.createElement('th');
        th.textContent = h;
        htr.appendChild(th);
      });
      thead.appendChild(htr);
      auditBody.appendChild(thead);
      var tbody = document.createElement('tbody');
      tbody.id = 'audit-tbody';
      auditBody.appendChild(tbody);
      auditWrap.appendChild(auditBody);
      auditSection.appendChild(auditWrap);

      // Append everything
      layout.appendChild(redCol);
      layout.appendChild(blueCol);
      layout.appendChild(logSection);
      layout.appendChild(overrideSection);
      layout.appendChild(actionsSection);
      layout.appendChild(auditSection);
    }

    // ── Helpers ────────────────────────────────────────────────────────────────
    function appendPlaceholder(sel, text) {
      var opt = document.createElement('option');
      opt.value = '';
      opt.textContent = text;
      sel.appendChild(opt);
    }

    function appendOption(sel, val, text) {
      var opt = document.createElement('option');
      opt.value = val;
      opt.textContent = text;
      sel.appendChild(opt);
    }

    function makePenaltyBtn(label, type, alliance) {
      var btn = document.createElement('button');
      btn.className = 'penalty-btn ' + type;
      btn.textContent = label;
      btn.addEventListener('click', function () { emitPenalty(alliance, type); });
      return btn;
    }

    // ── Socket / API ───────────────────────────────────────────────────────────
    var socket;
    function getSocket() {
      if (!socket) socket = SK.connectSocket();
      return socket;
    }

    function emitPenalty(alliance, type) {
      if (!state.matchId) { showToast('No match loaded', 'error'); return; }
      var teamSel = alliance === 'red' ? redTeamSel : blueTeamSel;
      var teamNumber = teamSel.value || null;
      getSocket().emit('penalty', {
        matchId: state.matchId,
        alliance: alliance,
        teamNumber: teamNumber,
        type: type,
      });
    }

    function applyOverride(alliance, field, value) {
      if (!state.matchId) { showToast('No match loaded', 'error'); return; }
      if (isNaN(value)) { showToast('Enter a valid value', 'error'); return; }
      fetch('/api/matches/' + state.matchId + '/override', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ alliance: alliance, field: field, value: value }),
      })
        .then(function (r) { if (!r.ok) throw new Error('Failed'); return r.json(); })
        .then(function () { showToast('Override applied', 'success'); fetchAuditLog(); })
        .catch(function () { showToast('Override failed', 'error'); });
    }

    function commitScores() {
      if (!state.matchId) { showToast('No match loaded', 'error'); return; }
      fetch('/api/matches/' + state.matchId + '/commit', { method: 'POST' })
        .then(function (r) { if (!r.ok) throw new Error('Failed'); return r.json(); })
        .then(function () { showToast('Scores committed', 'success'); })
        .catch(function () { showToast('Commit failed', 'error'); });
    }

    function replayMatch() {
      if (!state.matchId) { showToast('No match loaded', 'error'); return; }
      if (!confirm('Mark this match for replay?')) return;
      fetch('/api/matches/' + state.matchId + '/replay', { method: 'POST' })
        .then(function (r) { if (!r.ok) throw new Error('Failed'); return r.json(); })
        .then(function () { showToast('Match marked for replay', 'success'); })
        .catch(function () { showToast('Replay failed', 'error'); });
    }

    function fetchAuditLog() {
      if (!state.matchId) return;
      fetch('/api/matches/' + state.matchId + '/audit')
        .then(function (r) { return r.json(); })
        .then(function (entries) { renderAuditLog(entries); })
        .catch(function () {});
    }

    function renderAuditLog(entries) {
      var tbody = document.getElementById('audit-tbody');
      if (!tbody) return;
      while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
      if (!entries || !entries.length) {
        var row = document.createElement('tr');
        var td = document.createElement('td');
        td.colSpan = 4;
        td.textContent = 'No audit entries';
        td.style.color = 'var(--text2)';
        td.style.textAlign = 'center';
        row.appendChild(td);
        tbody.appendChild(row);
        return;
      }
      entries.forEach(function (e) {
        var row = document.createElement('tr');
        [e.created_at || '', e.user || 'system', e.action || '', e.details || ''].forEach(function (cell) {
          var td = document.createElement('td');
          td.textContent = cell;
          row.appendChild(td);
        });
        tbody.appendChild(row);
      });
    }

    // ── Timer / match fetch ────────────────────────────────────────────────────
    function fetchTimerState() {
      fetch('/api/timer')
        .then(function (r) { return r.json(); })
        .then(function (ts) {
          SK.applyTimerState(ts, timerEl, periodLbl);
          if (ts.matchId) {
            state.matchId = ts.matchId;
            fetchMatch(ts.matchId);
          }
        })
        .catch(function () {});
    }

    function fetchMatch(matchId) {
      fetch('/api/matches/' + matchId)
        .then(function (r) { return r.json(); })
        .then(function (m) { if (m) populateTeams(m); })
        .catch(function () {});
    }

    function populateTeams(match) {
      state.redTeams  = [match.red1,  match.red2].filter(Boolean);
      state.blueTeams = [match.blue1, match.blue2].filter(Boolean);
      fillTeamSelect(redTeamSel,  state.redTeams);
      fillTeamSelect(blueTeamSel, state.blueTeams);
    }

    function fillTeamSelect(sel, teams) {
      while (sel.firstChild) sel.removeChild(sel.firstChild);
      appendPlaceholder(sel, 'Select Team');
      teams.forEach(function (t) {
        var opt = document.createElement('option');
        opt.value = t;
        opt.textContent = 'Team ' + t;
        sel.appendChild(opt);
      });
    }

    // ── Penalty log ────────────────────────────────────────────────────────────
    function renderEmptyLog() {
      while (logBody.firstChild) logBody.removeChild(logBody.firstChild);
      var empty = document.createElement('div');
      empty.className = 'empty-log';
      empty.textContent = 'No penalties yet';
      logBody.appendChild(empty);
    }

    function addLogEntry(entry) {
      if (logBody.querySelector('.empty-log')) {
        while (logBody.firstChild) logBody.removeChild(logBody.firstChild);
      }
      var row = document.createElement('div');
      row.className = 'penalty-log-entry';

      var timeEl = document.createElement('span');
      timeEl.className = 'log-time';
      timeEl.textContent = entry.time || '--:--';

      var typeEl = document.createElement('span');
      typeEl.className = 'log-type ' + (entry.type || '');
      typeEl.textContent = (entry.type || '').toUpperCase();

      var teamEl = document.createElement('span');
      teamEl.className = 'log-team';
      teamEl.textContent = entry.teamNumber ? 'Team ' + entry.teamNumber : 'N/A';

      var allianceEl = document.createElement('span');
      allianceEl.className = 'log-alliance ' + (entry.alliance || '');
      allianceEl.textContent = (entry.alliance || '').toUpperCase();

      row.appendChild(timeEl);
      row.appendChild(typeEl);
      row.appendChild(teamEl);
      row.appendChild(allianceEl);
      logBody.insertBefore(row, logBody.firstChild);
    }

    // ── Socket events ──────────────────────────────────────────────────────────
    function connectSocketEvents() {
      var sock = getSocket();
      if (!sock) return;

      sock.on('timer_tick', function (ts) {
        SK.applyTimerState(ts, timerEl, periodLbl);
      });

      sock.on('period_change', function (ts) {
        SK.applyTimerState(ts, timerEl, periodLbl);
        SK.playBuzzer();
      });

      sock.on('score_update', function (data) {
        if (data && data.red  && data.red.total  != null) redScoreEl.textContent  = data.red.total;
        if (data && data.blue && data.blue.total != null) blueScoreEl.textContent = data.blue.total;
      });

      sock.on('penalty_added', function (entry) {
        addLogEntry(entry);
        showToast((entry.alliance || '').toUpperCase() + ' ' + (entry.type || '') + ' penalty', 'error');
      });

      sock.on('match_loaded', function (data) {
        if (data && data.matchId) {
          state.matchId = data.matchId;
          fetchMatch(data.matchId);
        }
        renderEmptyLog();
      });
    }

  })();
  </script>
</body>
</html>
